<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">T19 perfil de desplazamiento ordinal</title>
  <desc id="desc">Matriz simple de cambio de probabilidad para posibilidad de elegir método, edad y plan con profit sharing entre cartera conservadora, mixta y más expuesta a acciones.</desc>

  <rect x="0" y="0" width="800" height="260" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="30" font-size="15" font-weight="700">T19 - Perfil de desplazamiento ordinal</text>
    <text x="24" y="48" font-size="12" fill="#5a6a79">Cambio de probabilidad por variable y tipo de cartera</text>
  </g>

  <rect x="24" y="72" width="752" height="34" fill="#f5f7fa" stroke="#d3dce4"/>
  <rect x="24" y="106" width="752" height="126" fill="#ffffff" stroke="#d3dce4"/>

  <g stroke="#d3dce4" stroke-width="1">
    <line x1="274" y1="72" x2="274" y2="232"/>
    <line x1="441" y1="72" x2="441" y2="232"/>
    <line x1="608" y1="72" x2="608" y2="232"/>
    <line x1="24" y1="148" x2="776" y2="148"/>
    <line x1="24" y1="190" x2="776" y2="190"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#3f5366" font-size="11.5" text-anchor="middle">
    <text x="358" y="93">Cartera conservadora</text>
    <text x="525" y="93">Cartera mixta</text>
    <text x="692" y="93">Cartera más expuesta a acciones</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f" font-size="12">
    <text x="36" y="132" font-weight="700">Puede elegir método (sí/no)</text>
    <text x="36" y="174" font-weight="700">Edad (+1 año)</text>
    <text x="36" y="216" font-weight="700">Plan con profit sharing (sí/no)</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#40566a" font-size="11" text-anchor="middle">
    <rect x="292" y="116" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="358" y="131">Baja</text>
    <rect x="459" y="116" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="525" y="131">Casi sin cambio</text>
    <rect x="626" y="116" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="692" y="131">Sube</text>

    <rect x="292" y="158" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="358" y="173">Sube</text>
    <rect x="459" y="158" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="525" y="173">Casi sin cambio</text>
    <rect x="626" y="158" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="692" y="173">Baja</text>

    <rect x="292" y="200" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="358" y="215">Baja</text>
    <rect x="459" y="200" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="525" y="215">Baja leve</text>
    <rect x="626" y="200" width="131" height="22" rx="5" fill="#f4f6f8" stroke="#d7dfe6"/>
    <text x="692" y="215">Sube</text>
  </g>
</svg>
