<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Efectos dinámicos estimados por imputación BJS</title>
  <desc id="desc">Event study con dos estimaciones pretratamiento próximas a cero y efectos negativos en los horizontes cero y uno, acompañados por intervalos de confianza de 95 por ciento.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#15324a">Efectos dinámicos estimados por imputación</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">Dos períodos previos y los horizontes posteriores con información efectiva suficiente</text>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="118" y1="110" x2="1120" y2="110"/><line x1="118" y1="230" x2="1120" y2="230"/>
    <line x1="118" y1="350" x2="1120" y2="350"/><line x1="118" y1="470" x2="1120" y2="470"/>
  </g>
  <line x1="118" y1="230" x2="1120" y2="230" stroke="#718592" stroke-width="2"/>
  <line x1="580" y1="96" x2="580" y2="505" stroke="#8293a1" stroke-width="2" stroke-dasharray="7 6"/>

  <g font-family="Arial, sans-serif" font-size="16" fill="#526575" text-anchor="end">
    <text x="98" y="116">0,04</text><text x="98" y="236">0</text><text x="98" y="356">−0,04</text><text x="98" y="476">−0,08</text>
  </g>
  <text x="40" y="292" transform="rotate(-90 40 292)" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">Efecto sobre log empleo adolescente</text>

  <g stroke="#b04a60" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="130" x2="250" y2="290"/><line x1="450" y1="163" x2="450" y2="384"/>
  </g>
  <g stroke="#277da1" stroke-width="4" stroke-linecap="round">
    <line x1="710" y1="243" x2="710" y2="404"/><line x1="940" y1="273" x2="940" y2="500"/>
  </g>
  <g stroke-width="3">
    <line x1="238" y1="130" x2="262" y2="130" stroke="#b04a60"/><line x1="238" y1="290" x2="262" y2="290" stroke="#b04a60"/>
    <line x1="438" y1="163" x2="462" y2="163" stroke="#b04a60"/><line x1="438" y1="384" x2="462" y2="384" stroke="#b04a60"/>
    <line x1="698" y1="243" x2="722" y2="243" stroke="#277da1"/><line x1="698" y1="404" x2="722" y2="404" stroke="#277da1"/>
    <line x1="928" y1="273" x2="952" y2="273" stroke="#277da1"/><line x1="928" y1="500" x2="952" y2="500" stroke="#277da1"/>
  </g>
  <rect x="241" y="201" width="18" height="18" rx="3" fill="#b04a60"/>
  <rect x="441" y="265" width="18" height="18" rx="3" fill="#b04a60"/>
  <circle cx="710" cy="323" r="10" fill="#277da1"/>
  <circle cx="940" cy="387" r="10" fill="#277da1"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="250" y="539" font-size="17" fill="#314858">K = −2</text><text x="450" y="539" font-size="17" fill="#314858">K = −1</text>
    <text x="710" y="539" font-size="17" fill="#314858">K = 0</text><text x="940" y="539" font-size="17" fill="#314858">K = 1</text>
    <text x="600" y="576" font-size="17" fill="#526575">Años relativos a la adopción</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#314858">
    <rect x="330" y="602" width="16" height="16" rx="3" fill="#b04a60"/><text x="358" y="616">Pretratamiento</text>
    <circle cx="660" cy="610" r="9" fill="#277da1"/><text x="682" y="616">Efectos posteriores</text>
    <text x="880" y="616" fill="#617481">IC95%</text>
  </g>
  <text x="600" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#617481">K = 2 y K = 3 se omiten por información efectiva insuficiente; no representan efectos iguales a cero.</text>
</svg>
