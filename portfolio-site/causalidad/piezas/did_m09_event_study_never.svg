<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Event study ETWFE con condados nunca tratados como comparación</title>
  <desc id="desc">Estimaciones seleccionadas antes y después de la primera apertura de Walmart. Los períodos previos muestran diferencias negativas sistemáticas y el test conjunto rechaza ausencia de pretrends.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15324a">La dinámica posterior convive con diferencias previas</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526575">ETWFE con 394 condados nunca tratados · IC95% · K = −1 como base</text>
  <g stroke="#dce5eb" stroke-width="1">
    <line x1="110" y1="110" x2="1120" y2="110"/><line x1="110" y1="210" x2="1120" y2="210"/><line x1="110" y1="310" x2="1120" y2="310"/><line x1="110" y1="410" x2="1120" y2="410"/><line x1="110" y1="510" x2="1120" y2="510"/>
  </g>
  <line x1="110" y1="410" x2="1120" y2="410" stroke="#718592" stroke-width="2"/>
  <line x1="630" y1="95" x2="630" y2="525" stroke="#8293a1" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-family="Arial,sans-serif" font-size="15" fill="#526575" text-anchor="end">
    <text x="92" y="116">0,15</text><text x="92" y="216">0,10</text><text x="92" y="316">0,05</text><text x="92" y="416">0</text><text x="92" y="516">−0,05</text>
  </g>
  <text x="38" y="310" transform="rotate(-90 38 310)" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526575">Efecto sobre log empleo minorista</text>

  <g stroke="#b04a60" stroke-width="4" stroke-linecap="round">
    <line x1="190" y1="464" x2="190" y2="537"/><line x1="310" y1="446" x2="310" y2="511"/><line x1="430" y1="439" x2="430" y2="495"/><line x1="550" y1="421" x2="550" y2="468"/>
  </g>
  <g stroke="#277da1" stroke-width="4" stroke-linecap="round">
    <line x1="710" y1="353" x2="710" y2="374"/><line x1="830" y1="284" x2="830" y2="315"/><line x1="950" y1="238" x2="950" y2="308"/><line x1="1080" y1="72" x2="1080" y2="205"/>
  </g>
  <g fill="#b04a60">
    <rect x="182" y="492" width="16" height="16" rx="3"/><rect x="302" y="470" width="16" height="16" rx="3"/><rect x="422" y="458" width="16" height="16" rx="3"/><rect x="542" y="436" width="16" height="16" rx="3"/>
  </g>
  <g fill="#277da1"><circle cx="710" cy="363" r="9"/><circle cx="830" cy="299" r="9"/><circle cx="950" cy="273" r="9"/><circle cx="1080" cy="138" r="9"/></g>
  <g stroke-width="3">
    <path d="M178 464h24 M178 537h24 M298 446h24 M298 511h24 M418 439h24 M418 495h24 M538 421h24 M538 468h24" stroke="#b04a60"/>
    <path d="M698 353h24 M698 374h24 M818 284h24 M818 315h24 M938 238h24 M938 308h24 M1068 72h24 M1068 205h24" stroke="#277da1"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#314858" text-anchor="middle">
    <text x="190" y="555">K=−8</text><text x="310" y="555">K=−7</text><text x="430" y="555">K=−6</text><text x="550" y="555">K=−5</text>
    <text x="630" y="555" fill="#617481">K=−1</text><text x="710" y="555">K=0</text><text x="830" y="555">K=1</text><text x="950" y="555">K=5</text><text x="1080" y="555">K=10</text>
  </g>
  <text x="615" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526575">Tiempo relativo a la primera apertura</text>
  <rect x="180" y="607" width="840" height="32" rx="8" fill="#fbf2f4" stroke="#e6bcc6"/>
  <text x="600" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#8c3448">Pretrends conjuntos: χ²(7) = 40,16 · p &lt; 0,001 — los leads diagnostican el problema; no lo corrigen</text>
</svg>
