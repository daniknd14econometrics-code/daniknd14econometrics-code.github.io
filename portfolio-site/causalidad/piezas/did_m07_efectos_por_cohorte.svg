<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Efectos estimados por cohorte y promedio GAverage</title>
  <desc id="desc">Coefplot horizontal con intervalos de confianza. La cohorte 2004 tiene un efecto de menos 0,0846; las cohortes 2006 y 2007 efectos de menos 0,0202 y menos 0,0288; GAverage es menos 0,0328.</desc>
  <style>
    .title{font:700 26px system-ui,sans-serif;fill:#18344d}.sub{font:400 14px system-ui,sans-serif;fill:#5d7180}
    .label{font:600 16px system-ui,sans-serif;fill:#263f52}.small{font:400 13px system-ui,sans-serif;fill:#657985}
    .value{font:700 14px system-ui,sans-serif;fill:#18344d}.grid{stroke:#dfe7eb;stroke-width:1}.zero{stroke:#647a86;stroke-width:2;stroke-dasharray:7 7}
    .ci{stroke:#7595a6;stroke-width:4;stroke-linecap:round}.cap{stroke:#7595a6;stroke-width:2}.point{fill:#225f7d;stroke:#fff;stroke-width:2}
    .ciavg{stroke:#b34a66;stroke-width:5;stroke-linecap:round}.capavg{stroke:#b34a66;stroke-width:2}.avg{fill:#b34a66;stroke:#fff;stroke-width:2}
  </style>
  <rect width="1120" height="620" rx="24" fill="#f7fafb"/>
  <text x="560" y="45" text-anchor="middle" class="title">La heterogeneidad aparece antes del agregado</text>
  <text x="560" y="70" text-anchor="middle" class="sub">DR-IPW con condados nunca tratados · efecto sobre el log del empleo adolescente</text>

  <line x1="280" y1="105" x2="280" y2="530" class="grid"/><line x1="494" y1="105" x2="494" y2="530" class="grid"/><line x1="708" y1="105" x2="708" y2="530" class="grid"/><line x1="922" y1="96" x2="922" y2="540" class="zero"/><line x1="1050" y1="105" x2="1050" y2="530" class="grid"/>
  <text x="280" y="562" text-anchor="middle" class="small">−0,15</text><text x="494" y="562" text-anchor="middle" class="small">−0,10</text><text x="708" y="562" text-anchor="middle" class="small">−0,05</text><text x="922" y="562" text-anchor="middle" class="small">0</text><text x="1050" y="562" text-anchor="middle" class="small">0,03</text>
  <text x="665" y="596" text-anchor="middle" class="label">Efecto estimado e IC95%</text>

  <text x="54" y="159" class="label">Cohorte 2004</text><text x="54" y="180" class="small">20 condados</text>
  <line x1="354" y1="155" x2="766" y2="155" class="ci"/><line x1="354" y1="143" x2="354" y2="167" class="cap"/><line x1="766" y1="143" x2="766" y2="167" class="cap"/><circle cx="560" cy="155" r="10" class="point"/><text x="785" y="161" class="value">−0,0846</text>

  <text x="54" y="259" class="label">Cohorte 2006</text><text x="54" y="280" class="small">40 condados</text>
  <line x1="689" y1="255" x2="982" y2="255" class="ci"/><line x1="689" y1="243" x2="689" y2="267" class="cap"/><line x1="982" y1="243" x2="982" y2="267" class="cap"/><circle cx="836" cy="255" r="10" class="point"/><text x="999" y="261" class="value">−0,0202</text>

  <text x="54" y="359" class="label">Cohorte 2007</text><text x="54" y="380" class="small">131 condados</text>
  <line x1="663" y1="355" x2="935" y2="355" class="ci"/><line x1="663" y1="343" x2="663" y2="367" class="cap"/><line x1="935" y1="343" x2="935" y2="367" class="cap"/><circle cx="799" cy="355" r="10" class="point"/><text x="952" y="361" class="value">−0,0288</text>

  <rect x="35" y="425" width="1045" height="88" rx="15" fill="#fff2f5" stroke="#e3c1cb"/>
  <text x="54" y="464" class="label">GAverage</text><text x="54" y="486" class="small">agregación posterior por cohorte</text>
  <line x1="682" y1="469" x2="881" y2="469" class="ciavg"/><line x1="682" y1="456" x2="682" y2="482" class="capavg"/><line x1="881" y1="456" x2="881" y2="482" class="capavg"/><circle cx="782" cy="469" r="11" class="avg"/><text x="899" y="475" class="value">−0,0328</text>
</svg>
