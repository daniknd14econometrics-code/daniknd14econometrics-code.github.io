<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Overlap del propensity score en la muestra NSW</title>
  <desc id="desc">Histogramas de densidad para 185 participantes tratados y 260 controles. Los puntajes se superponen principalmente entre 0,239 y 0,629.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#15324a">Distribución del propensity score</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">Participantes y controles de la muestra NSW</text>

  <rect x="191" y="120" width="625" height="450" fill="#e9f3ef" opacity="0.75"/>
  <text x="503" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3e6b59">Intersección de soporte: 0,239–0,629</text>
  <g stroke="#dce5eb" stroke-width="1">
    <line x1="140" y1="570" x2="980" y2="570"/><line x1="140" y1="480" x2="980" y2="480"/>
    <line x1="140" y1="390" x2="980" y2="390"/><line x1="140" y1="300" x2="980" y2="300"/>
    <line x1="140" y1="210" x2="980" y2="210"/><line x1="140" y1="120" x2="980" y2="120"/>
  </g>
  <line x1="140" y1="120" x2="140" y2="570" stroke="#8293a1" stroke-width="2"/>
  <line x1="140" y1="570" x2="980" y2="570" stroke="#8293a1" stroke-width="2"/>
  <line x1="191" y1="120" x2="191" y2="570" stroke="#5e8e78" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="816" y1="120" x2="816" y2="570" stroke="#5e8e78" stroke-width="2" stroke-dasharray="7 6"/>

  <g fill="#277da1" opacity="0.72">
    <rect x="148" y="535.4" width="34" height="34.6"/><rect x="232" y="525.0" width="34" height="45.0"/>
    <rect x="316" y="480.0" width="34" height="90.0"/><rect x="400" y="175.4" width="34" height="394.6"/>
    <rect x="484" y="407.3" width="34" height="162.7"/><rect x="568" y="542.3" width="34" height="27.7"/>
    <rect x="652" y="504.2" width="34" height="65.8"/><rect x="736" y="528.5" width="34" height="41.5"/>
    <rect x="820" y="531.9" width="34" height="38.1"/><rect x="904" y="570" width="34" height="0"/>
  </g>
  <g fill="#c94f6d" opacity="0.68">
    <rect x="183" y="565.1" width="34" height="4.9"/><rect x="267" y="535.9" width="34" height="34.1"/>
    <rect x="351" y="531.1" width="34" height="38.9"/><rect x="435" y="234.3" width="34" height="335.7"/>
    <rect x="519" y="409.4" width="34" height="160.6"/><rect x="603" y="506.8" width="34" height="63.2"/>
    <rect x="687" y="404.6" width="34" height="165.4"/><rect x="771" y="521.4" width="34" height="48.6"/>
    <rect x="855" y="526.2" width="34" height="43.8"/><rect x="939" y="565.1" width="34" height="4.9"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" fill="#526575" text-anchor="end">
    <text x="126" y="576">0</text><text x="126" y="486">2</text><text x="126" y="396">4</text>
    <text x="126" y="306">6</text><text x="126" y="216">8</text><text x="126" y="126">10</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#526575" text-anchor="middle">
    <text x="140" y="605">0,20</text><text x="308" y="605">0,30</text><text x="476" y="605">0,40</text>
    <text x="644" y="605">0,50</text><text x="812" y="605">0,60</text><text x="980" y="605">0,70</text>
  </g>
  <text x="560" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#314858">Propensity score estimado</text>
  <text x="42" y="345" transform="rotate(-90 42 345)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#314858">Densidad</text>

  <rect x="1007" y="173" width="24" height="24" fill="#277da1" opacity="0.72"/>
  <text x="1045" y="192" font-family="Arial, sans-serif" font-size="17" fill="#314858">Control (260)</text>
  <rect x="1007" y="215" width="24" height="24" fill="#c94f6d" opacity="0.68"/>
  <text x="1045" y="234" font-family="Arial, sans-serif" font-size="17" fill="#314858">Tratado (185)</text>
  <text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526575">Histogramas con intervalos de 0,05; propensity score logit estimado con covariables predeterminadas.</text>
</svg>
