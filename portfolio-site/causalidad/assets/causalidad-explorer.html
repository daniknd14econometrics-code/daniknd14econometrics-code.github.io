<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".js-causalidad-explorer").forEach((explorer) => {
    const tabs = Array.from(explorer.querySelectorAll('[role="tab"]'));
    const panels = Array.from(explorer.querySelectorAll('[role="tabpanel"]'));
    const select = explorer.querySelector("select");

    if (!tabs.length || !panels.length || !select) return;

    const slugForPanel = (panel) => panel.id.replace(/^area-/, "");

    const panelFromHash = () => {
      let slug;

      try {
        slug = decodeURIComponent(window.location.hash.slice(1));
      } catch {
        return null;
      }

      return panels.find((panel) => slugForPanel(panel) === slug) || null;
    };

    const replaceHash = (panel) => {
      const url = new URL(window.location.href);
      url.hash = slugForPanel(panel);
      history.replaceState(history.state, "", `${url.pathname}${url.search}${url.hash}`);
    };

    const clearInvalidHash = () => {
      if (!window.location.hash) return;

      const url = new URL(window.location.href);
      url.hash = "";
      history.replaceState(history.state, "", `${url.pathname}${url.search}`);
    };

    const activate = (panelId, updateUrl = false) => {
      const target = panels.find((panel) => panel.id === panelId) || panels[0];

      panels.forEach((panel) => {
        const isActive = panel === target;
        panel.hidden = !isActive;
        panel.classList.toggle("is-active", isActive);
      });

      tabs.forEach((tab) => {
        const isActive = tab.getAttribute("aria-controls") === target.id;
        tab.setAttribute("aria-selected", String(isActive));
        tab.tabIndex = isActive ? 0 : -1;
      });

      select.value = target.id;

      if (updateUrl) replaceHash(target);
    };

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => activate(tab.getAttribute("aria-controls"), true));
      tab.addEventListener("keydown", (event) => {
        let nextIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
        if (event.key === "ArrowUp" || event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = tabs.length - 1;
        if (nextIndex === undefined) return;

        event.preventDefault();
        const nextTab = tabs[nextIndex];
        activate(nextTab.getAttribute("aria-controls"), true);
        nextTab.focus();
      });
    });

    select.addEventListener("change", () => activate(select.value, true));

    const restoreFromUrl = () => {
      const target = panelFromHash();
      if (!target) clearInvalidHash();
      activate(target ? target.id : panels[0].id);
    };

    window.addEventListener("hashchange", restoreFromUrl);
    window.addEventListener("pageshow", restoreFromUrl);
    explorer.classList.add("is-enhanced");
    restoreFromUrl();
  });
});
</script>
