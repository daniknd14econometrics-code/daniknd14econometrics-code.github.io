<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Métricas de respuesta fraccional en 401k</title><desc id="desc">Random Forest logra la menor deviance fraccional y MCO produce predicciones fuera del soporte.</desc><rect width="900" height="520" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Respetar el soporte cambia la comparación</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Fractional deviance de test · menor es mejor</text><g font-family="Arial" font-size="15" fill="#17324d"><text x="48" y="145">MCO</text><rect x="170" y="120" width="530" height="34" rx="5" fill="#8d9aa4"/><text x="715" y="145">0,2474</text><text x="48" y="205">Fractional Logit</text><rect x="170" y="180" width="482" height="34" rx="5" fill="#536575"/><text x="667" y="205">0,2247</text><text x="48" y="265">CART</text><rect x="170" y="240" width="466" height="34" rx="5" fill="#6e8c9b"/><text x="651" y="265">0,2169</text><text x="48" y="325">GAM</text><rect x="170" y="300" width="456" height="34" rx="5" fill="#1b7892"/><text x="641" y="325">0,2131</text><text x="48" y="385">Splines</text><rect x="170" y="360" width="452" height="34" rx="5" fill="#d39a65"/><text x="637" y="385">0,2113</text><text x="48" y="445">Random Forest</text><rect x="170" y="420" width="438" height="34" rx="5" fill="#e1813b"/><text x="623" y="445">0,2045</text></g><text x="48" y="490" font-family="Arial" font-size="13" fill="#536575">MCO produce nueve medias superiores a 1 en el test; una métrica favorable no corrige un soporte imposible.</text></svg>
