<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">Hitters: RMSE externo por procedimiento</title><desc id="desc">RMSE externo: MCO 349,39; Forward 351,93; Ridge mínimo 355,16; Lasso mínimo 355,23; Backward 357,01; Ridge 1SE 373,89; Lasso 1SE 379,74.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="880" height="520" rx="18" fill="#f8fafc"/><text x="28" y="42" font-size="25" font-weight="700" fill="#17324d">El error cambia poco; la complejidad cambia mucho</text><text x="28" y="72" font-size="17" fill="#5d6b78">Hitters · RMSE externo sobre predicciones outer-OOF</text><rect x="22" y="96" width="836" height="330" rx="14" fill="#fff"/><text x="44" y="132" font-size="16" fill="#5d6b78">RMSE (menor es mejor)</text><path d="M220 158V390M380 158V390M540 158V390M700 158V390" stroke="#dce3e9"/><text x="220" y="410" text-anchor="middle" font-size="15" fill="#5d6b78">340</text><text x="380" y="410" text-anchor="middle" font-size="15" fill="#5d6b78">355</text><text x="540" y="410" text-anchor="middle" font-size="15" fill="#5d6b78">370</text><text x="700" y="410" text-anchor="middle" font-size="15" fill="#5d6b78">385</text><g font-size="16" fill="#17324d" font-weight="600"><text x="44" y="180">MCO completo</text><text x="44" y="211">Forward-CV</text><text x="44" y="242">Ridge mínimo</text><text x="44" y="273">Lasso mínimo</text><text x="44" y="304">Backward-CV</text><text x="44" y="335">Ridge 1SE</text><text x="44" y="366">Lasso 1SE</text></g><g fill="#0b7285"><rect x="220" y="164" width="100" height="20" rx="4"/><rect x="220" y="195" width="127" height="20" rx="4"/><rect x="220" y="226" width="151" height="20" rx="4"/><rect x="220" y="257" width="153" height="20" rx="4"/><rect x="220" y="288" width="170" height="20" rx="4"/></g><g fill="#b76514"><rect x="220" y="319" width="361" height="20" rx="4"/><rect x="220" y="350" width="397" height="20" rx="4"/></g><g font-size="16" fill="#17324d" font-weight="700"><text x="330" y="181">349,39</text><text x="357" y="212">351,93</text><text x="381" y="243">355,16</text><text x="383" y="274">355,23</text><text x="400" y="305">357,01</text><text x="591" y="336">373,89</text><text x="627" y="367">379,74</text></g><text x="28" y="466" font-size="18" font-weight="700" fill="#17324d">MCO queda primero; 1SE compra parsimonia a cambio de RMSE.</text><text x="28" y="496" font-size="15" fill="#5d6b78">Las diferencias entre los métodos con λ mínimo son pequeñas.</text></g></svg>
