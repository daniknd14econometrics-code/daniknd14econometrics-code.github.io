<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-labelledby="title desc"><title id="title">College: certeza anunciada y frecuencia observada</title><desc id="desc">Posterior superior a 0,8: LDA anuncia 98,07 % y observa 97,22 %, n=540; QDA 99,07 % y 92,03 %, n=590; NB 99,37 % y 92,76 %, n=580.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="880" height="548" rx="18" fill="#f8fafc"/><text x="28" y="40" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">Anunciar casi certeza no garantiza observarla</text><text x="28" y="71" font-size="16" fill="#5d6b78" font-weight="400" text-anchor="start">College · instituciones con posterior superior a 0,8 en cada modelo</text><rect x="22" y="96" width="836" height="330" rx="14" fill="#fff"/><circle cx="48" cy="122" r="6" fill="#17324d"/><text x="63" y="129" font-size="16" fill="#17324d" font-weight="400" text-anchor="start">Probabilidad media anunciada</text><circle cx="405" cy="122" r="6" fill="#0b7285"/><text x="420" y="129" font-size="16" fill="#17324d" font-weight="400" text-anchor="start">Frecuencia privada observada</text><path d="M246 157 V357" stroke="#dce3e9"/><text x="246" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">90 %</text><path d="M332 157 V357" stroke="#dce3e9"/><text x="332" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">92 %</text><path d="M418 157 V357" stroke="#dce3e9"/><text x="418" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">94 %</text><path d="M504 157 V357" stroke="#dce3e9"/><text x="504" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">96 %</text><path d="M590 157 V357" stroke="#dce3e9"/><text x="590" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">98 %</text><path d="M676 157 V357" stroke="#dce3e9"/><text x="676" y="393" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">100 %</text><text x="44" y="186" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">LDA</text><text x="44" y="209" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">n = 540</text><path d="M593.0099999999998 186 H556.4599999999999" stroke="#a7b6c3" stroke-width="3"/><circle cx="593.0099999999998" cy="186" r="7" fill="#17324d"/><circle cx="556.4599999999999" cy="186" r="7" fill="#0b7285"/><text x="711" y="180" font-size="17" fill="#17324d" font-weight="600" text-anchor="start">98,07 %</text><text x="711" y="204" font-size="17" fill="#0b7285" font-weight="600" text-anchor="start">97,22 %</text><text x="44" y="261" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">QDA</text><text x="44" y="284" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">n = 590</text><path d="M636.0099999999998 261 H333.2900000000001" stroke="#a7b6c3" stroke-width="3"/><circle cx="636.0099999999998" cy="261" r="7" fill="#17324d"/><circle cx="333.2900000000001" cy="261" r="7" fill="#0b7285"/><text x="711" y="255" font-size="17" fill="#17324d" font-weight="600" text-anchor="start">99,07 %</text><text x="711" y="279" font-size="17" fill="#0b7285" font-weight="600" text-anchor="start">92,03 %</text><text x="44" y="336" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">Gaussian NB</text><text x="44" y="359" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">n = 580</text><path d="M648.9100000000002 336 H364.68000000000023" stroke="#a7b6c3" stroke-width="3"/><circle cx="648.9100000000002" cy="336" r="7" fill="#17324d"/><circle cx="364.68000000000023" cy="336" r="7" fill="#0b7285"/><text x="711" y="330" font-size="17" fill="#17324d" font-weight="600" text-anchor="start">99,37 %</text><text x="711" y="354" font-size="17" fill="#0b7285" font-weight="600" text-anchor="start">92,76 %</text><text x="28" y="465" font-size="17" fill="#17324d" font-weight="700" text-anchor="start">Los grupos difieren entre modelos; no son las mismas instituciones.</text><text x="28" y="495" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Detalle del intervalo superior reportado, no evaluación de calibración completa.</text><text x="28" y="523" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Eje ampliado de 90 a 100 %. Las líneas unen dos valores; no son intervalos.</text></g></svg>
