<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-labelledby="title desc"><title id="title">Caravan: concentración de distancias</title><desc id="desc">Medianas de razones individuales: 2 dimensiones 0,000; 10 dimensiones 0,132; 40 dimensiones 0,322; 85 dimensiones 0,488.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="880" height="548" rx="18" fill="#f8fafc"/><text x="28" y="40" font-size="25" fill="#17324d" font-weight="700" text-anchor="start">El vecino más próximo pierde contraste</text><text x="28" y="71" font-size="17" fill="#5d6b78" font-weight="400" text-anchor="start">Mediana de la razón: distancia mínima / distancia mediana</text><rect x="22" y="97" width="836" height="336" rx="14" fill="#fff"/><text x="44" y="132" font-size="16" fill="#5d6b78" font-weight="400" text-anchor="start">Dimensiones</text><path d="M230 151 V385" stroke="#dce3e9"/><text x="230" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,0</text><path d="M326 151 V385" stroke="#dce3e9"/><text x="326" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,1</text><path d="M422 151 V385" stroke="#dce3e9"/><text x="422" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,2</text><path d="M518 151 V385" stroke="#dce3e9"/><text x="518" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,3</text><path d="M614 151 V385" stroke="#dce3e9"/><text x="614" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,4</text><path d="M710 151 V385" stroke="#dce3e9"/><text x="710" y="411" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="middle">0,5</text><text x="67" y="181" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">2</text><circle cx="230" cy="174" r="4" fill="#0b7285"/><text x="242" y="181" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">0,000</text><text x="67" y="238" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">10</text><rect x="230" y="215" width="126.72" height="32" rx="4" fill="#0b7285"/><text x="368.72" y="238" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">0,132</text><text x="67" y="295" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">40</text><rect x="230" y="272" width="309.12" height="32" rx="4" fill="#0b7285"/><text x="551.12" y="295" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">0,322</text><text x="67" y="352" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">85</text><rect x="230" y="329" width="468.48" height="32" rx="4" fill="#0b7285"/><text x="710.48" y="352" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">0,488</text><text x="28" y="468" font-size="17" fill="#17324d" font-weight="700" text-anchor="start">600 observaciones · diagnóstico separado de la evaluación predictiva</text><text x="28" y="498" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Los espacios usan los primeros predictores de la base; no son modelos candidatos.</text><text x="28" y="525" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">En dos dimensiones hay coincidencias exactas entre observaciones.</text></g></svg>
