<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Dos mecanismos detrás de una masa en el límite</title>
  <desc id="desc">Comparación entre compras cero reales de manzanas ecológicas y censura superior del ingreso familiar.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 25px system-ui,sans-serif;fill:#17324d}.sub{font:500 14px system-ui,sans-serif;fill:#52677a}.label{font:700 16px system-ui,sans-serif;fill:#17324d}.small{font:500 13px system-ui,sans-serif;fill:#52677a}.num{font:800 32px system-ui,sans-serif;fill:#0b7285}.axis{stroke:#9aabba;stroke-width:1.2}.bar{fill:#0b7285}.bar2{fill:#78b7c3}.ghost{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:7 6}.cap{stroke:#d97706;stroke-width:3}.note{fill:#eef6f7;stroke:#c4e0e4}.warn{fill:#fff7e6;stroke:#f1d29a}.white{fill:#fff}.pct{font:800 15px system-ui,sans-serif;fill:#fff}.orange{fill:#b45309}
  </style>
  <rect class="bg" width="960" height="520" rx="18"/>
  <text class="head" x="48" y="48">El borde observado no identifica el mecanismo</text>
  <text class="sub" x="48" y="75">Dos aplicaciones, dos tipos de información y una decisión de modelado previa al estimador</text>
  <rect class="panel" x="40" y="102" width="425" height="370" rx="15"/>
  <rect class="panel" x="495" y="102" width="425" height="370" rx="15"/>
  <text class="label" x="66" y="137">A. Solución de esquina</text>
  <text class="sub" x="66" y="160">Libras de manzanas ecológicas · N = 660</text>
  <line class="axis" x1="77" y1="317" x2="425" y2="317"/>
  <rect class="bar" x="90" y="198" width="48" height="119" rx="4"/>
  <rect class="bar2" x="157" y="246" width="32" height="71" rx="3"/>
  <rect class="bar2" x="202" y="265" width="32" height="52" rx="3"/>
  <rect class="bar2" x="247" y="280" width="32" height="37" rx="3"/>
  <rect class="bar2" x="292" y="289" width="32" height="28" rx="3"/>
  <rect class="bar2" x="337" y="298" width="32" height="19" rx="3"/>
  <rect class="bar2" x="382" y="304" width="32" height="13" rx="3"/>
  <text class="pct" x="94" y="228">37,6%</text>
  <text class="small" x="99" y="340">0</text>
  <text class="small" x="183" y="340">compras positivas</text>
  <rect class="note" x="68" y="365" width="369" height="78" rx="10"/>
  <text class="label" x="86" y="392">El cero es el resultado completo.</text>
  <text class="small" x="86" y="417">248 hogares pudieron comprar y eligieron no hacerlo.</text>
  <text class="small" x="86" y="436">No hay una cantidad negativa o latente por recuperar.</text>
  <text class="label" x="521" y="137">B. Censura verdadera</text>
  <text class="sub" x="521" y="160">Ingreso familiar, miles de US$ · N = 5.634</text>
  <line class="axis" x1="536" y1="317" x2="879" y2="317"/>
  <rect class="bar2" x="548" y="290" width="28" height="27" rx="3"/>
  <rect class="bar2" x="585" y="262" width="28" height="55" rx="3"/>
  <rect class="bar2" x="622" y="229" width="28" height="88" rx="3"/>
  <rect class="bar2" x="659" y="240" width="28" height="77" rx="3"/>
  <rect class="bar2" x="696" y="265" width="28" height="52" rx="3"/>
  <rect class="bar2" x="733" y="284" width="28" height="33" rx="3"/>
  <rect class="bar" x="778" y="210" width="48" height="107" rx="4"/>
  <text class="pct" x="783" y="239">10,1%</text>
  <line class="cap" x1="831" y1="188" x2="831" y2="329"/>
  <path class="ghost" d="M832 230 C852 242, 870 265, 891 299"/>
  <text class="small" x="781" y="340">112,5</text>
  <text class="small orange" x="838" y="206">cola latente</text>
  <rect class="warn" x="523" y="365" width="369" height="78" rx="10"/>
  <text class="label" x="541" y="392">El tope resume información incompleta.</text>
  <text class="small" x="541" y="417">568 casos significan “112,5 o más”.</text>
  <text class="small" x="541" y="436">El valor económico continúa detrás del límite de registro.</text>
</svg>
