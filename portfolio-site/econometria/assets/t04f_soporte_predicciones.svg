<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">Soporte observado y rangos de predicción</title><desc id="desc">Comparación del rango observado de voto con los rangos ajustados de cuatro modelos sobre una escala de cero a uno.</desc>
<style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 25px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.value{font:800 15px system-ui,sans-serif;fill:#0b7285}.axis{stroke:#aebbc6;stroke-width:1.2}.grid{stroke:#e5ebf0;stroke-width:1}.obs{stroke:#d97706;stroke-width:10;stroke-linecap:round}.mean{stroke:#0b7285;stroke-width:8;stroke-linecap:round}.linear{stroke:#79bdc6;stroke-width:8;stroke-linecap:round}.tick{stroke:#17324d;stroke-width:2}.pill{fill:#fff7e6;stroke:#f0cf91}.ok{fill:#e9f7f7;stroke:#79bdc6}</style>
<rect class="bg" width="960" height="530" rx="18"/><text class="head" x="42" y="45">El soporte observado no fuerza una única elección</text><text class="sub" x="42" y="70">Resultado y medias ajustadas · escala fraccional de 0 a 1</text>
<rect class="panel" x="42" y="96" width="876" height="346" rx="16"/>
<line class="axis" x1="245" y1="392" x2="875" y2="392"/><line class="grid" x1="245" y1="120" x2="245" y2="400"/><line class="grid" x1="371" y1="120" x2="371" y2="400"/><line class="grid" x1="497" y1="120" x2="497" y2="400"/><line class="grid" x1="623" y1="120" x2="623" y2="400"/><line class="grid" x1="749" y1="120" x2="749" y2="400"/><line class="grid" x1="875" y1="120" x2="875" y2="400"/>
<text class="small" x="240" y="418">0</text><text class="small" x="361" y="418">0,2</text><text class="small" x="487" y="418">0,4</text><text class="small" x="613" y="418">0,6</text><text class="small" x="739" y="418">0,8</text><text class="small" x="868" y="418">1</text>
<text class="label" x="68" y="149">Observado</text><line class="obs" x1="554" y1="145" x2="837" y2="145"/><line class="tick" x1="554" y1="134" x2="554" y2="156"/><line class="tick" x1="837" y1="134" x2="837" y2="156"/><text class="value" x="653" y="134">0,490–0,940</text>
<text class="label" x="68" y="205">Lineal</text><line class="linear" x1="553" y1="201" x2="763" y2="201"/><text class="value" x="648" y="190">0,489–0,822</text>
<text class="label" x="68" y="261">Fractional logit</text><line class="mean" x1="546" y1="257" x2="751" y2="257"/><text class="value" x="638" y="246">0,478–0,803</text>
<text class="label" x="68" y="317">Fractional probit</text><line class="mean" x1="546" y1="313" x2="755" y2="313"/><text class="value" x="640" y="302">0,478–0,809</text>
<text class="label" x="68" y="373">Beta MLE</text><line class="mean" x1="542" y1="369" x2="757" y2="369"/><text class="value" x="637" y="358">0,471–0,813</text>
<rect class="pill" x="42" y="462" width="420" height="45" rx="13"/><text class="label" x="62" y="489">0 observaciones en 0 · 0 observaciones en 1</text><rect class="ok" x="480" y="462" width="438" height="45" rx="13"/><text class="small" x="501" y="482">El lineal queda dentro del soporte en esta muestra;</text><text class="small" x="501" y="498">fractional logit, probit y beta lo garantizan por construcción.</text>
</svg>
