<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Efecto marginal promedio del gasto entre modelos</title><desc id="desc">Cuatro efectos marginales promedio e intervalos de confianza del 95 por ciento, junto con interpretación en puntos porcentuales y cautela RESET.</desc>
<style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 25px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.value{font:800 20px system-ui,sans-serif;fill:#0b7285}.axis{stroke:#aebbc6;stroke-width:1.2}.grid{stroke:#e5ebf0;stroke-width:1}.ci{stroke:#79bdc6;stroke-width:5;stroke-linecap:round}.dot{fill:#17324d}.band{fill:#e9f7f7}.pill{fill:#fff7e6;stroke:#f0cf91}.call{fill:#e9f7f7;stroke:#79bdc6}</style>
<rect class="bg" width="960" height="560" rx="18"/><text class="head" x="42" y="45">El APE del gasto es estable entre especificaciones</text><text class="sub" x="42" y="70">Efecto sobre E(voto/100|x) · estimación e IC95%</text>
<rect class="panel" x="42" y="96" width="876" height="310" rx="16"/>
<line class="axis" x1="170" y1="365" x2="860" y2="365"/><line class="grid" x1="170" y1="120" x2="170" y2="373"/><line class="grid" x1="342" y1="120" x2="342" y2="373"/><line class="grid" x1="515" y1="120" x2="515" y2="373"/><line class="grid" x1="687" y1="120" x2="687" y2="373"/><line class="grid" x1="860" y1="120" x2="860" y2="373"/>
<text class="small" x="163" y="390">0</text><text class="small" x="328" y="390">0,05</text><text class="small" x="500" y="390">0,10</text><text class="small" x="672" y="390">0,15</text><text class="small" x="846" y="390">0,20</text>
<text class="label" x="67" y="151">Lineal</text><line class="ci" x1="282" y1="147" x2="820" y2="147"/><circle class="dot" cx="551" cy="147" r="8"/><text class="value" x="565" y="140">0,1105</text>
<text class="label" x="67" y="211">F. logit</text><line class="ci" x1="279" y1="207" x2="798" y2="207"/><circle class="dot" cx="539" cy="207" r="8"/><text class="value" x="553" y="200">0,1068</text>
<text class="label" x="67" y="271">F. probit</text><line class="ci" x1="278" y1="267" x2="801" y2="267"/><circle class="dot" cx="540" cy="267" r="8"/><text class="value" x="554" y="260">0,1072</text>
<text class="label" x="67" y="331">Beta MLE</text><line class="ci" x1="266" y1="327" x2="790" y2="327"/><circle class="dot" cx="528" cy="327" r="8"/><text class="value" x="542" y="320">0,1037</text>
<rect class="call" x="42" y="427" width="505" height="91" rx="15"/><text class="label" x="64" y="455">+10 pp en participación del gasto</text><text class="value" x="64" y="485">≈ +1,0–1,1 pp de voto</text><text class="small" x="64" y="505">La comparación se realiza en APE, no en índices crudos.</text>
<rect class="pill" x="565" y="427" width="353" height="91" rx="15"/><text class="label" x="587" y="455">RESET · fractional logit básico</text><text class="value" x="587" y="482">χ²(2)=41,60 · p&lt;0,001</text><text class="small" x="587" y="504">Estabilidad y forma funcional son preguntas distintas.</text>
</svg>
