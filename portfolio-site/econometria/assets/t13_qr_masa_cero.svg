<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc"><title id="title">Menos masa en cero entre participantes</title><desc id="desc">Ingreso laboral real de 1978 · proporciones observadas</desc><g font-family="Segoe UI, system-ui, sans-serif"><rect width="880" height="460" rx="18" fill="#f8fafc"/><rect x="26" y="104" width="828" height="268" rx="14" fill="white" stroke="#dbe4ec"/><text x="34" y="44" font-size="26" fill="#17324d" font-weight="700" text-anchor="start">Menos masa en cero entre participantes</text><text x="34" y="76" font-size="17" fill="#52677a" font-weight="500" text-anchor="start">Ingreso laboral real de 1978 · proporciones observadas</text><line x1="245" y1="305" x2="750" y2="305" stroke="#dbe4ec" stroke-width="1" /><line x1="245" y1="139" x2="245" y2="305" stroke="#dbe4ec" stroke-width="1" /><text x="245" y="333" font-size="17" fill="#52677a" font-weight="500" text-anchor="middle">0%</text><line x1="371.25" y1="139" x2="371.25" y2="305" stroke="#dbe4ec" stroke-width="1" /><text x="371.25" y="333" font-size="17" fill="#52677a" font-weight="500" text-anchor="middle">10%</text><line x1="497.5" y1="139" x2="497.5" y2="305" stroke="#dbe4ec" stroke-width="1" /><text x="497.5" y="333" font-size="17" fill="#52677a" font-weight="500" text-anchor="middle">20%</text><line x1="623.75" y1="139" x2="623.75" y2="305" stroke="#dbe4ec" stroke-width="1" /><text x="623.75" y="333" font-size="17" fill="#52677a" font-weight="500" text-anchor="middle">30%</text><line x1="750" y1="139" x2="750" y2="305" stroke="#dbe4ec" stroke-width="1" /><text x="750" y="333" font-size="17" fill="#52677a" font-weight="500" text-anchor="middle">40%</text><text x="50" y="177" font-size="20" fill="#17324d" font-weight="650" text-anchor="start">Controles</text><text x="50" y="201" font-size="16" fill="#52677a" font-weight="500" text-anchor="start">425 personas</text><rect x="245" y="155" width="383.17" height="42" rx="4" fill="#17324d"/><text x="640.17" y="184" font-size="23" fill="#17324d" font-weight="750" text-anchor="start">30,35%</text><text x="50" y="265" font-size="20" fill="#17324d" font-weight="650" text-anchor="start">Participantes</text><text x="50" y="289" font-size="16" fill="#52677a" font-weight="500" text-anchor="start">297 personas</text><rect x="245" y="243" width="284.82" height="42" rx="4" fill="#0b7285"/><text x="541.82" y="272" font-size="23" fill="#0b7285" font-weight="750" text-anchor="start">22,56%</text><text x="34" y="398" font-size="18" fill="#17324d" font-weight="600" text-anchor="start">El cuantil inferior puede seguir en cero en un grupo y haber salido en el otro.</text><text x="34" y="427" font-size="16" fill="#52677a" font-weight="500" text-anchor="start">Conservar los ceros mantiene la pregunta sobre toda la distribución de ingreso.</text></g></svg>
