<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Poisson y binomial negativa para clases salteadas</title>
  <desc id="desc">Comparación de las distribuciones predichas Poisson y NB2 para un perfil académico. Las medias y los efectos marginales son próximos, pero NB2 asigna más probabilidad al cero y a la cola derecha.</desc>
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 24px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.axis{stroke:#9aabba;stroke-width:1.2}.grid{stroke:#e5ebf0;stroke-width:1}.pois{fill:none;stroke:#0b7285;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.nb{fill:none;stroke:#d97706;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.dotp{fill:#0b7285}.dotn{fill:#d97706}.pill{fill:#edf8f8;stroke:#b8dde2}.tail{fill:#fff7e6;stroke:#f0cf91}.value{font:800 18px system-ui,sans-serif;fill:#17324d}.note{font:700 12px system-ui,sans-serif;fill:#9a5204}</style>
  <rect class="bg" width="960" height="520" rx="18"/><text class="head" x="42" y="44">Medias próximas no implican distribuciones semejantes</text><text class="sub" x="42" y="69">Clases salteadas · perfil con priGPA 2,6, ACT 22, segundo año y 90% de tareas entregadas</text>
  <rect class="pill" x="42" y="88" width="266" height="56" rx="12"/><text class="small" x="59" y="111">Media predicha</text><text class="value" x="59" y="133">4,89 <tspan class="small">Poisson</tspan> · 4,76 <tspan class="small">NB2</tspan></text>
  <rect class="pill" x="323" y="88" width="286" height="56" rx="12"/><text class="small" x="340" y="111">APE de promedio previo</text><text class="value" x="340" y="133">−3,63 <tspan class="small">Poisson</tspan> · −3,87 <tspan class="small">NB2</tspan></text>
  <line class="pois" x1="650" y1="108" x2="686" y2="108"/><circle class="dotp" cx="668" cy="108" r="5"/><text class="small" x="696" y="112">Poisson</text><line class="nb" x1="786" y1="108" x2="822" y2="108"/><circle class="dotn" cx="804" cy="108" r="5"/><text class="small" x="832" y="112">NB2</text>
  <rect class="panel" x="42" y="160" width="876" height="310" rx="15"/>
  <line class="grid" x1="88" y1="215" x2="878" y2="215"/><line class="grid" x1="88" y1="284" x2="878" y2="284"/><line class="grid" x1="88" y1="353" x2="878" y2="353"/><line class="axis" x1="88" y1="422" x2="878" y2="422"/><line class="axis" x1="88" y1="180" x2="88" y2="422"/>
  <text class="small" x="62" y="426">0</text><text class="small" x="48" y="357">0,05</text><text class="small" x="48" y="288">0,10</text><text class="small" x="48" y="219">0,15</text><text class="small" x="84" y="446">0</text><text class="small" x="274" y="446">5</text><text class="small" x="466" y="446">10</text><text class="small" x="660" y="446">15</text><text class="small" x="848" y="446">20</text><text class="small" x="422" y="464">Número de clases salteadas</text>
  <polyline class="pois" points="88.0,411.7 126.5,371.4 165.0,298.2 203.5,220.0 242.0,174.9 280.5,180.1 319.0,224.7 357.5,284.1 396.0,337.6 434.5,376.1 473.0,399.6 511.5,412.0 550.0,417.9 588.5,420.5 627.0,421.5 665.5,421.8 704.0,421.9 742.5,422.0 781.0,422.0 819.5,422.0 858.0,422.0"/><polyline class="nb" points="88.0,356.2 126.5,286.3 165.0,243.7 203.5,232.1 242.0,243.4 280.5,267.4 319.0,295.8 357.5,323.5 396.0,347.8 434.5,367.6 473.0,383.0 511.5,394.6 550.0,403.0 588.5,409.1 627.0,413.3 665.5,416.2 704.0,418.2 742.5,419.5 781.0,420.4 819.5,420.9 858.0,421.3"/>
  <circle class="dotp" cx="88" cy="411.7" r="5"/><circle class="dotn" cx="88" cy="356.2" r="5"/><circle class="dotp" cx="242" cy="174.9" r="5"/><circle class="dotn" cx="203.5" cy="232.1" r="5"/>
  <rect class="tail" x="620" y="184" width="270" height="91" rx="12"/><text class="label" x="639" y="207">Las colas revelan la diferencia</text><text class="small" x="639" y="230">P(Y=0): <tspan class="note">0,75%</tspan> Poisson · <tspan class="note">4,77%</tspan> NB2</text><text class="small" x="639" y="252">Masa entre 10 y 30: <tspan class="note">2,8%</tspan> · <tspan class="note">9,0%</tspan></text>
  <text class="small" x="42" y="498">NB2 estima α = 0,275 (p&lt;0,001): la flexibilidad afecta la forma condicional, no solo la inferencia.</text>
</svg>
