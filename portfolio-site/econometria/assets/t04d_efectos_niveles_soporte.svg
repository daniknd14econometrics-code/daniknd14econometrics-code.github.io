<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Efectos en niveles y soporte dentro de firma</title><desc id="desc">Derivadas promedio de intensidad bajo pooled y fixed effects, más diagnóstico de diez firmas que cambian de estado de I+D.</desc>
<style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 25px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.value{font:800 27px system-ui,sans-serif;fill:#0b7285}.axis{stroke:#aebbc6}.ci{stroke:#79bdc6;stroke-width:8;stroke-linecap:round}.ci2{stroke:#0b7285;stroke-width:9;stroke-linecap:round}.dot{fill:#17324d}.pill{fill:#fff7e6;stroke:#f0cf91}.warn{fill:#d97706}</style>
<rect class="bg" width="960" height="520" rx="18"/><text class="head" x="42" y="45">La traducción en niveles también se reduce con efectos fijos</text><text class="sub" x="42" y="70">Derivada promedio de la media de patentes respecto de la intensidad de I+D · IC95%</text>
<rect class="panel" x="42" y="96" width="590" height="328" rx="16"/><line class="axis" x1="105" y1="355" x2="590" y2="355"/><text class="small" x="98" y="379">0</text><text class="small" x="218" y="379">5</text><text class="small" x="337" y="379">10</text><text class="small" x="456" y="379">15</text><text class="small" x="568" y="379">20</text>
<text class="label" x="72" y="142">Pooled QMLE cluster</text><line class="ci" x1="339" y1="190" x2="581" y2="190"/><circle class="dot" cx="461" cy="190" r="9"/><text class="value" x="420" y="165">14,82</text><text class="small" x="420" y="219">EE 2,57 · p&lt;0,001</text>
<text class="label" x="72" y="269">FE · versión auxiliar con dummies</text><line class="ci2" x1="106" y1="317" x2="334" y2="317"/><circle class="dot" cx="219" cy="317" r="9"/><text class="value" x="187" y="292">4,78</text><text class="small" x="187" y="346">EE 2,43 · p=0,0489</text>
<rect class="pill" x="654" y="96" width="264" height="210" rx="16"/><text class="label" x="680" y="130">Soporte del margen extensivo</text><text class="value warn" x="680" y="183">10 firmas</text><text class="small" x="680" y="212">cambian alguna vez entre</text><text class="small" x="680" y="233">I+D cero y positiva.</text><text class="small" x="680" y="268">Pooled: +0,84 · p=0,447</text><text class="small" x="680" y="289">FE: −0,41 · p=0,852</text>
<rect class="panel" x="654" y="326" width="264" height="98" rx="16"/><text class="label" x="680" y="358">Cambio finito +1 log</text><text class="small" x="680" y="384">Pooled +20,43 · p&lt;0,001</text><text class="small" x="680" y="405">FE +5,28 · p=0,0735</text>
<text class="small" x="42" y="477">La derivada FE tiene p=0,0489; el cambio finito FE, p=0,0735 y queda como referencia secundaria.</text>
</svg>
