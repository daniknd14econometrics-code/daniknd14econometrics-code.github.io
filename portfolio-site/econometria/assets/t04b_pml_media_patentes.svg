<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Calibración de la media de patentes bajo Poisson PML</title>
  <desc id="desc">Medias observadas y predichas por deciles de la predicción Poisson PML. Los deciles uno a ocho usan una escala de cero a veinte y los deciles nueve y diez una escala separada de cero a ciento cincuenta para evitar que el último decil oculte la calibración del resto.</desc>
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 24px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.axis{stroke:#9aabba;stroke-width:1.2}.grid{stroke:#e5ebf0;stroke-width:1}.obs{fill:none;stroke:#0b7285;stroke-width:4;stroke-linejoin:round}.pred{fill:none;stroke:#d97706;stroke-width:4;stroke-linejoin:round}.obsp{fill:#0b7285}.predp{fill:#d97706}.link{stroke:#b7c3cd;stroke-width:3}.pill{fill:#edf8f8;stroke:#b8dde2}.note{font:700 12px system-ui,sans-serif;fill:#0b5964}</style>
  <rect class="bg" width="960" height="520" rx="18"/><text class="head" x="42" y="44">PML se evalúa por la media, no por probabilidades Poisson</text><text class="sub" x="42" y="69">Patentes por firma-año · medias observadas y predichas dentro de deciles de la media predicha</text>
  <line class="obs" x1="664" y1="55" x2="697" y2="55"/><circle class="obsp" cx="681" cy="55" r="5"/><text class="small" x="706" y="59">observada</text><line class="pred" x1="790" y1="55" x2="823" y2="55"/><circle class="predp" cx="807" cy="55" r="5"/><text class="small" x="832" y="59">predicha</text>
  <rect class="panel" x="42" y="94" width="486" height="370" rx="15"/><text class="label" x="66" y="125">A. Deciles 1–8 · escala 0–20</text><text class="small" x="66" y="146">La escala ampliada hace visible la calibración fuera de la cola extrema.</text>
  <line class="grid" x1="84" y1="295" x2="490" y2="295"/><line class="grid" x1="84" y1="180" x2="490" y2="180"/><line class="axis" x1="84" y1="410" x2="490" y2="410"/><line class="axis" x1="84" y1="180" x2="84" y2="410"/>
  <text class="small" x="61" y="414">0</text><text class="small" x="54" y="299">10</text><text class="small" x="54" y="184">20</text><text class="small" x="80" y="434">1</text><text class="small" x="135" y="434">2</text><text class="small" x="190" y="434">3</text><text class="small" x="245" y="434">4</text><text class="small" x="300" y="434">5</text><text class="small" x="355" y="434">6</text><text class="small" x="410" y="434">7</text><text class="small" x="465" y="434">8</text>
  <polyline class="obs" points="84.0,405.4 139.0,397.4 194.0,389.8 249.0,378.7 304.0,374.9 359.0,356.3 414.0,288.4 469.0,195.8"/><polyline class="pred" points="84.0,402.7 139.0,392.9 194.0,382.8 249.0,370.3 304.0,353.8 359.0,334.2 414.0,290.7 469.0,194.3"/>
  <g class="obsp"><circle cx="84" cy="405.4" r="4"/><circle cx="139" cy="397.4" r="4"/><circle cx="194" cy="389.8" r="4"/><circle cx="249" cy="378.7" r="4"/><circle cx="304" cy="374.9" r="4"/><circle cx="359" cy="356.3" r="4"/><circle cx="414" cy="288.4" r="4"/><circle cx="469" cy="195.8" r="4"/></g><g class="predp"><circle cx="84" cy="402.7" r="4"/><circle cx="139" cy="392.9" r="4"/><circle cx="194" cy="382.8" r="4"/><circle cx="249" cy="370.3" r="4"/><circle cx="304" cy="353.8" r="4"/><circle cx="359" cy="334.2" r="4"/><circle cx="414" cy="290.7" r="4"/><circle cx="469" cy="194.3" r="4"/></g>
  <rect class="panel" x="548" y="94" width="370" height="370" rx="15"/><text class="label" x="572" y="125">B. Deciles 9–10 · escala 0–150</text><text class="small" x="572" y="146">La cola alta concentra gran parte de la media total.</text>
  <text class="label" x="572" y="226">Decil 9</text><text class="small" x="572" y="247">43,09 observada · 37,31 predicha</text><line class="link" x1="677.2" y1="276" x2="687.6" y2="276"/><circle class="predp" cx="677.2" cy="276" r="7"/><circle class="obsp" cx="687.6" cy="276" r="7"/>
  <text class="label" x="572" y="326">Decil 10</text><text class="small" x="572" y="347">143,70 observada · 143,83 predicha</text><line class="link" x1="868.7" y1="376" x2="868.9" y2="376"/><circle class="obsp" cx="868.7" cy="376" r="7"/><circle class="predp" cx="868.9" cy="376" r="5"/>
  <line class="axis" x1="610" y1="410" x2="880" y2="410"/><text class="small" x="606" y="432">0</text><text class="small" x="694" y="432">50</text><text class="small" x="782" y="432">100</text><text class="small" x="867" y="432">150</text>
  <rect class="pill" x="548" y="474" width="370" height="28" rx="13"/><text class="note" x="568" y="493">La evaluación se concentra en la media condicional E(Y|X).</text>
</svg>
