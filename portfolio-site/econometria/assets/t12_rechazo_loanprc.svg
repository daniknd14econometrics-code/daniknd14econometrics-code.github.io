<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Rechazo observado y probabilidad ajustada según loanprc</title>
  <desc id="desc">A la izquierda, tasas observadas de rechazo por diez grupos de loanprc. A la derecha, probabilidades promedio ajustadas con logit e intervalo de confianza del 95 por ciento.</desc>
  <rect width="1200" height="660" rx="22" fill="#f7fafb"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18344d">El apalancamiento se traduce en mayor riesgo de rechazo</text>
  <text x="60" y="86" font-family="Arial, sans-serif" font-size="16" fill="#5d7180">Evidencia observada y trayectoria ajustada cuentan la misma historia, con incertidumbre creciente en el extremo alto.</text>
  <rect x="45" y="115" width="525" height="445" rx="16" fill="#ffffff" stroke="#dfe7eb"/>
  <rect x="600" y="115" width="555" height="445" rx="16" fill="#ffffff" stroke="#dfe7eb"/>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263f52">Rechazo observado por grupos de loanprc</text>
  <text x="625" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263f52">Probabilidad promedio ajustada · logit</text>
  <g stroke="#e6edf0" stroke-width="1">
    <line x1="80" y1="500" x2="540" y2="500"/><line x1="80" y1="400" x2="540" y2="400"/><line x1="80" y1="300" x2="540" y2="300"/><line x1="80" y1="200" x2="540" y2="200"/>
    <line x1="650" y1="500" x2="1125" y2="500"/><line x1="650" y1="400" x2="1125" y2="400"/><line x1="650" y1="300" x2="1125" y2="300"/><line x1="650" y1="200" x2="1125" y2="200"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#667b89">
    <text x="50" y="505">0%</text><text x="44" y="405">10%</text><text x="44" y="305">20%</text><text x="44" y="205">30%</text>
    <text x="620" y="505">0%</text><text x="614" y="405">10%</text><text x="614" y="305">20%</text><text x="614" y="205">30%</text>
  </g>
  <g fill="#7595a6">
    <rect x="93" y="465" width="31" height="35" rx="3"/><rect x="137" y="429" width="31" height="71" rx="3"/><rect x="181" y="414" width="31" height="86" rx="3"/>
    <rect x="225" y="384" width="31" height="116" rx="3"/><rect x="269" y="380" width="31" height="120" rx="3"/><rect x="313" y="438" width="31" height="62" rx="3"/>
    <rect x="357" y="383" width="31" height="117" rx="3"/><rect x="401" y="331" width="31" height="169" rx="3"/><rect x="445" y="365" width="31" height="135" rx="3"/><rect x="489" y="235" width="31" height="265" rx="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667b89" text-anchor="middle">
    <text x="108" y="522">1</text><text x="152" y="522">2</text><text x="196" y="522">3</text><text x="240" y="522">4</text><text x="284" y="522">5</text><text x="328" y="522">6</text><text x="372" y="522">7</text><text x="416" y="522">8</text><text x="460" y="522">9</text><text x="504" y="522">10</text>
    <text x="306" y="545">Grupos ordenados de loanprc</text>
  </g>
  <polygon points="660,453 718,440 777,425 835,409 894,393 952,380 1011,359 1069,340 1120,321 1120,448 1069,416 1011,372 952,348 894,327 835,313 777,293 718,270 660,265" fill="#b34a66" opacity="0.15"/>
  <polyline points="660,428 718,418 777,406 835,393 894,379 952,363 1011,346 1069,327 1120,306" fill="none" stroke="#b34a66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#b34a66" stroke="#ffffff" stroke-width="2">
    <circle cx="660" cy="428" r="5"/><circle cx="718" cy="418" r="5"/><circle cx="777" cy="406" r="5"/><circle cx="835" cy="393" r="5"/><circle cx="894" cy="379" r="5"/><circle cx="952" cy="363" r="5"/><circle cx="1011" cy="346" r="5"/><circle cx="1069" cy="327" r="5"/><circle cx="1120" cy="306" r="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667b89" text-anchor="middle">
    <text x="660" y="522">0,4</text><text x="777" y="522">0,6</text><text x="894" y="522">0,8</text><text x="1011" y="522">1,0</text><text x="1120" y="522">1,2</text><text x="890" y="545">Préstamo / precio de la propiedad (loanprc)</text>
  </g>
  <line x1="825" y1="180" x2="865" y2="180" stroke="#b34a66" stroke-width="4"/><text x="875" y="185" font-family="Arial, sans-serif" font-size="13" fill="#5d7180">Promedio ajustado</text>
  <rect x="825" y="192" width="40" height="12" fill="#b34a66" opacity="0.15"/><text x="875" y="203" font-family="Arial, sans-serif" font-size="13" fill="#5d7180">IC95%</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="13" fill="#667b89">Fuente: Taller 5, loanapp. Medias observadas por grupos y margins logit sobre la muestra común (N=1.969).</text>
  <text x="60" y="632" font-family="Arial, sans-serif" font-size="13" fill="#667b89">Las curvas describen asociaciones condicionales; no identifican un efecto causal de loanprc.</text>
</svg>
