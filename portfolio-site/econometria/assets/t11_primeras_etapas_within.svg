  <g font-family="Arial, sans-serif" font-size="13" fill="#667b89" text-anchor="middle"><text x="315" y="545">Parte instrumentada de log(prob. de arresto)</text><text x="890" y="545">Parte instrumentada de log(policía per cápita)</text></g>
  <text x="58" y="607" font-family="Arial, sans-serif" font-size="13" fill="#667b89">Fuente: Taller 9A. Submuestra visual de los diagnósticos ya generados; N analítico=630, errores agrupados por condado.</text>
  <text x="58" y="629" font-family="Arial, sans-serif" font-size="13" fill="#667b89">Una pendiente visible no equivale a una primera etapa fuerte: la identificación conjunta necesita relevancia para ambas variables endógenas.</text>
