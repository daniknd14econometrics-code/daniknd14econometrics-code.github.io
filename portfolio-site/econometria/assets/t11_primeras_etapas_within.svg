<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Primeras etapas parciales en variación within</title>
  <desc id="desc">Dos paneles muestran la relación entre la parte instrumentada y el residuo de la probabilidad de arresto y de la policía per cápita, con estadísticos F de 4,54 y 1,70.</desc>
  <rect width="1200" height="650" rx="22" fill="#f7fafb"/>
  <text x="58" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18344d">La identificación debe aparecer dentro del condado</text>
  <text x="58" y="82" font-family="Arial, sans-serif" font-size="16" fill="#5d7180">Primera etapa parcial después de absorber controles, efectos de año y efectos de condado.</text>
  <rect x="45" y="110" width="530" height="450" rx="16" fill="#fff" stroke="#dfe7eb"/>
  <rect x="625" y="110" width="530" height="450" rx="16" fill="#fff" stroke="#dfe7eb"/>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263f52">Probabilidad de arresto</text>
  <text x="650" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263f52">Policía per cápita</text>
  <rect x="420" y="125" width="125" height="42" rx="21" fill="#e8f1f5"/><text x="482" y="152" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#225f7d">F = 4,54</text>
  <rect x="1000" y="125" width="125" height="42" rx="21" fill="#f6e9ed"/><text x="1062" y="152" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b34a66">F = 1,70</text>
