<title id="title">Subsidios y desperdicio bajo FE, RE y CRE-Mundlak</title><desc id="desc">Coeficientes e intervalos de confianza del 95 por ciento para subsidio actual y rezagado. Las tres especificaciones producen estimaciones muy similares.</desc>
