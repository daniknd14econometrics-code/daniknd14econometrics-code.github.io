<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">T15 decisión secuencial pooled RE CRE</title>
  <desc id="desc">Síntesis metodológica en tres etapas: trayectoria de modelos, respaldo formal y decisión operativa.</desc>

  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="28" font-size="15" font-weight="700">T15 - Síntesis de decisión metodológica</text>
    <text x="24" y="46" font-size="12" fill="#5a6a79">Trayectoria pooled / RE / CRE con foco en cambios de magnitud</text>
  </g>

  <g>
    <rect x="24" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="284" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="544" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="38" y="86" font-size="13" font-weight="700">1) Comparar trayectorias</text>
    <text x="38" y="106" font-size="12">pooled -&gt; RE -&gt; CRE</text>
    <text x="38" y="124" font-size="12">Las magnitudes se atenúan</text>
    <text x="38" y="142" font-size="12">de forma sostenida</text>
    <text x="38" y="160" font-size="12" fill="#4e5f6f">al pasar de pooled a CRE</text>

    <text x="298" y="86" font-size="13" font-weight="700">2) Respaldo formal</text>
    <text x="298" y="106" font-size="12">Los contrastes del bloque CRE</text>
    <text x="298" y="124" font-size="12">respaldan con fuerza</text>
    <text x="298" y="142" font-size="12">la misma dirección</text>
    <text x="298" y="160" font-size="12" fill="#4e5f6f">en la lectura metodológica</text>

    <text x="558" y="86" font-size="13" font-weight="700">3) Decisión operativa</text>
    <text x="558" y="106" font-size="12">CRE como lectura final</text>
    <text x="558" y="124" font-size="12">pooled y RE como referencia</text>
    <text x="558" y="142" font-size="12" fill="#4e5f6f">No se decide por un</text>
    <text x="558" y="160" font-size="12" fill="#4e5f6f">solo test o p-valor</text>
  </g>

  <g stroke="#9aa8b5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 142 L278 142"/>
    <path d="M272 138 L278 142 L272 146"/>
    <path d="M518 142 L538 142"/>
    <path d="M532 138 L538 142 L532 146"/>
  </g>
</svg>
