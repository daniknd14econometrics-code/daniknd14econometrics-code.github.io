<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Comparación descriptiva entre estados y dentro de cada estado</title>
  <desc id="desc">Dos paneles comparan la relación entre el impuesto a la cerveza y la tasa de accidentes. Las medias estatales muestran una pendiente positiva, mientras que las desviaciones dentro de cada estado muestran una pendiente negativa.</desc>
  <rect width="1200" height="650" rx="24" fill="#f7fafb"/>
  <text x="60" y="54" fill="#18344d" font-family="Arial, sans-serif" font-size="27" font-weight="700">La fuente de variación cambia la historia empírica</text>
  <text x="60" y="84" fill="#5d7180" font-family="Arial, sans-serif" font-size="16">Impuesto a la cerveza y accidentes de tránsito, 48 estados · 1982–1987</text>

  <text x="90" y="122" fill="#263f52" font-family="Arial, sans-serif" font-size="19" font-weight="700">Entre estados (between)</text>
  <text x="675" y="122" fill="#263f52" font-family="Arial, sans-serif" font-size="19" font-weight="700">Dentro de cada estado (within)</text>

