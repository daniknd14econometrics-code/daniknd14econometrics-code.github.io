<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">T2 síntesis de trayectoria metodológica</title>
  <desc id="desc">Secuencia metodológica en T2: comparación de enfoques pooled, ajuste de inferencia y decisión operativa como benchmark, no como cierre final.</desc>

  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="28" font-size="15" font-weight="700">T2 - Síntesis de trayectoria metodológica</text>
    <text x="24" y="46" font-size="12" fill="#5a6a79">Pooled como benchmark, inferencia más robusta y transición en panel</text>
  </g>

  <g>
    <rect x="24" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="284" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="544" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="38" y="86" font-size="13" font-weight="700">1) Comparar enfoques</text>
    <text x="38" y="106" font-size="12">Clásico - robusto - cluster + año</text>
    <text x="38" y="124" font-size="12">Los coeficientes casi no cambian</text>
    <text x="38" y="142" font-size="12" fill="#4e5f6f">La diferencia aparece en</text>
    <text x="38" y="160" font-size="12" fill="#4e5f6f">la confianza de la inferencia</text>

    <text x="298" y="86" font-size="13" font-weight="700">2) Señales del diagnóstico</text>
    <text x="298" y="106" font-size="12">Los errores muestran</text>
    <text x="298" y="124" font-size="12">dependencia temporal y variación desigual</text>
    <text x="298" y="142" font-size="12" fill="#4e5f6f">Con eso, la inferencia clásica</text>
    <text x="298" y="160" font-size="12" fill="#4e5f6f">queda corta para este panel</text>

    <text x="558" y="86" font-size="13" font-weight="700">3) Decisión operativa</text>
    <text x="558" y="106" font-size="12">Usar pooled + año + cluster</text>
    <text x="558" y="124" font-size="12">como benchmark de reporte</text>
    <text x="558" y="142" font-size="12" fill="#4e5f6f">Útil para ordenar evidencia,</text>
    <text x="558" y="160" font-size="12" fill="#4e5f6f">no como cierre final del caso</text>
  </g>

  <g stroke="#9aa8b5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 142 L278 142"/>
    <path d="M272 138 L278 142 L272 146"/>
    <path d="M518 142 L538 142"/>
    <path d="M532 138 L538 142 L532 146"/>
  </g>
</svg>
