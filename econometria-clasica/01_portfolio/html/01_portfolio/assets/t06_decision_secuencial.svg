<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">T6 síntesis de trayectoria metodológica</title>
  <desc id="desc">Secuencia metodológica en T6: paso a efectos fijos, lectura dentro de cada persona y cierre prudente sin adelantar FE versus RE.</desc>

  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="28" font-size="15" font-weight="700">T6 - Síntesis de trayectoria metodológica</text>
    <text x="24" y="46" font-size="12" fill="#5a6a79">Comparar a cada persona consigo misma y definir el alcance del cierre</text>
  </g>

  <g>
    <rect x="24" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="284" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="544" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="38" y="86" font-size="13" font-weight="700">1) Cambio de enfoque</text>
    <text x="38" y="106" font-size="12">De pooled a efectos fijos</text>
    <text x="38" y="124" font-size="12">Comparar a cada persona</text>
    <text x="38" y="142" font-size="12" fill="#4e5f6f">consigo misma en el tiempo</text>
    <text x="38" y="160" font-size="12" fill="#4e5f6f">La estructura panel sí importa</text>

    <text x="298" y="86" font-size="13" font-weight="700">2) Qué se puede estimar</text>
    <text x="298" y="106" font-size="12">Variables que cambian</text>
    <text x="298" y="124" font-size="12">dentro de cada persona</text>
    <text x="298" y="142" font-size="12" fill="#4e5f6f">Educación y rasgos invariantes</text>
    <text x="298" y="160" font-size="12" fill="#4e5f6f">quedan fuera en este enfoque</text>

    <text x="558" y="86" font-size="13" font-weight="700">3) Cierre del taller</text>
    <text x="558" y="106" font-size="12">Efectos de tiempo:</text>
    <text x="558" y="124" font-size="12">aporte acotado en esta base</text>
    <text x="558" y="142" font-size="12" fill="#4e5f6f">Se mantiene FE como lectura base</text>
    <text x="558" y="160" font-size="12" fill="#4e5f6f">sin adelantar FE versus RE</text>
  </g>

  <g stroke="#9aa8b5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 142 L278 142"/>
    <path d="M272 138 L278 142 L272 146"/>
    <path d="M518 142 L538 142"/>
    <path d="M532 138 L538 142 L532 146"/>
  </g>
</svg>
