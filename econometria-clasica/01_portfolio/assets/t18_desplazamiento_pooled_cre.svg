<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" role="img" aria-labelledby="title desc">
  <title id="title">T18 comparador pooled versus CRE por categoría</title>
  <desc id="desc">Comparación de cambios en probabilidad por categoría para Educación y Experiencia. El paso de pooled a CRE modifica de forma material la lectura en Escuela, Hogar y Trabajo.</desc>

  <rect x="0" y="0" width="800" height="272" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="29" font-size="15" font-weight="700">T18 - pooled vs CRE por categoría</text>
    <text x="24" y="47" font-size="12" fill="#5a6a79">El cambio de modelo altera la historia de probabilidades en Escuela, Hogar y Trabajo</text>
  </g>

  <rect x="24" y="66" width="752" height="184" fill="#ffffff" stroke="#d3dce4"/>

  <g stroke="#e3e9ef" stroke-width="1">
    <line x1="250" y1="66" x2="250" y2="250"/>
    <line x1="352" y1="66" x2="352" y2="250"/>
    <line x1="454" y1="66" x2="454" y2="250"/>
    <line x1="556" y1="66" x2="556" y2="250"/>
    <line x1="658" y1="66" x2="658" y2="250"/>
    <line x1="760" y1="66" x2="760" y2="250"/>
  </g>

  <line x1="454" y1="66" x2="454" y2="250" stroke="#9aa8b6" stroke-width="1.2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#5a6a79" font-size="10.5" text-anchor="middle">
    <text x="250" y="263">-16</text>
    <text x="352" y="263">-8</text>
    <text x="454" y="263">0</text>
    <text x="556" y="263">+8</text>
    <text x="658" y="263">+16</text>
    <text x="760" y="263">+24</text>
  </g>
  <text x="505" y="263" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5a6a79">Cambio en probabilidad (puntos porcentuales)</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f" font-size="12">
    <text x="24" y="80" font-weight="700">Educación</text>
    <text x="24" y="170" font-weight="700">Experiencia</text>
    <text x="120" y="98">Escuela</text>
    <text x="120" y="120">Hogar</text>
    <text x="120" y="142">Trabajo</text>
    <text x="120" y="188">Escuela</text>
    <text x="120" y="210">Hogar</text>
    <text x="120" y="232">Trabajo</text>
  </g>

  <g stroke="#a8b4c0" stroke-width="2.2" stroke-linecap="round">
    <line x1="507.3" y1="94" x2="298.5" y2="94"/>
    <line x1="381.8" y1="116" x2="558.9" y2="116"/>
    <line x1="473.4" y1="138" x2="504.6" y2="138"/>
    <line x1="263.4" y1="184" x2="411.3" y2="184"/>
    <line x1="357.9" y1="206" x2="558.2" y2="206"/>
    <line x1="740.5" y1="228" x2="392.6" y2="228"/>
  </g>

  <g>
    <circle cx="507.3" cy="94" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>
    <circle cx="381.8" cy="116" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>
    <circle cx="473.4" cy="138" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>
    <circle cx="263.4" cy="184" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>
    <circle cx="357.9" cy="206" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>
    <circle cx="740.5" cy="228" r="4.5" fill="#ffffff" stroke="#8fa0af" stroke-width="1.7"/>

    <circle cx="298.5" cy="94" r="4.5" fill="#2f4558"/>
    <circle cx="558.9" cy="116" r="4.5" fill="#2f4558"/>
    <circle cx="504.6" cy="138" r="4.5" fill="#2f4558"/>
    <circle cx="411.3" cy="184" r="4.5" fill="#2f4558"/>
    <circle cx="558.2" cy="206" r="4.5" fill="#2f4558"/>
    <circle cx="392.6" cy="228" r="4.5" fill="#2f4558"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#40566a">
    <circle cx="620" cy="29" r="4" fill="#ffffff" stroke="#8fa0af" stroke-width="1.6"/>
    <text x="632" y="33">Pooled</text>
    <circle cx="693" cy="29" r="4" fill="#2f4558"/>
    <text x="705" y="33">CRE</text>
  </g>
</svg>
