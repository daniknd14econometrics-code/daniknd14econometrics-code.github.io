<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Regresión local y elección del ancho de banda</title>
  <desc id="desc">Dos paneles comparan regresión global y métodos locales, y muestran el efecto de tres selectores de ancho de banda.</desc>
  <rect width="1200" height="610" rx="22" fill="#f7f4ee"/>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#24313a}.title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#59656d}.panel{font-size:17px;font-weight:700}.axis{stroke:#9aa4aa;stroke-width:1.2}.grid{stroke:#dcd8cf;stroke-width:1}.tick{font-size:13px;fill:#68737a}.legend{font-size:13px}.note{font-size:14px;font-weight:600}.dot{fill:#7b8790;opacity:.19}.global{fill:none;stroke:#7b8790;stroke-width:3;stroke-dasharray:8 7}.nw{fill:none;stroke:#d2764b;stroke-width:4}.ll{fill:none;stroke:#176b68;stroke-width:4}.cv{fill:none;stroke:#b65c45;stroke-width:3.5}.rot{fill:none;stroke:#287c78;stroke-width:3.5}.plug{fill:none;stroke:#253f58;stroke-width:3.5}
  </style>
  <text x="54" y="48" class="title">La forma se aprende localmente; h decide cuánto suavizar</text>
  <text x="54" y="75" class="sub">Curva de Engel en logaritmos · 5.507 hogares · rango central p10–p90</text>
  <rect x="42" y="100" width="548" height="442" rx="16" fill="#fff" stroke="#ded8ce"/>
  <rect x="610" y="100" width="548" height="442" rx="16" fill="#fff" stroke="#ded8ce"/>
