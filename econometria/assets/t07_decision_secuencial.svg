<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">T7 síntesis de trayectoria metodológica</title>
  <desc id="desc">Secuencia metodológica en T7: efectos fijos con inferencia robusta, lectura conjunta y cierre prudente en panel corto de firmas.</desc>

  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="28" font-size="15" font-weight="700">T7 - Síntesis de trayectoria metodológica</text>
    <text x="24" y="46" font-size="12" fill="#5a6a79">Efectos fijos en panel corto con foco en inferencia robusta y lectura conjunta</text>
  </g>

  <g>
    <rect x="24" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="284" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
    <rect x="544" y="62" width="232" height="160" rx="8" fill="#f5f7fa" stroke="#cfd7df"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="38" y="86" font-size="13" font-weight="700">1) Marco FE aplicado</text>
    <text x="38" y="106" font-size="12">Comparar cada firma</text>
    <text x="38" y="124" font-size="12">consigo misma en el tiempo</text>
    <text x="38" y="142" font-size="12" fill="#4e5f6f">Foco en subsidio actual</text>
    <text x="38" y="160" font-size="12" fill="#4e5f6f">y subsidio rezagado</text>

    <text x="298" y="86" font-size="13" font-weight="700">2) Inferencia robusta</text>
    <text x="298" y="106" font-size="12">La evidencia conjunta</text>
    <text x="298" y="124" font-size="12">es prudente en esta muestra</text>
    <text x="298" y="142" font-size="12">No conviene decidir</text>
    <text x="298" y="160" font-size="12" fill="#4e5f6f">por un coeficiente aislado</text>

    <text x="558" y="86" font-size="13" font-weight="700">3) Decisión operativa</text>
    <text x="558" y="106" font-size="12">Mantener FE + cluster</text>
    <text x="558" y="124" font-size="12">como estándar de reporte</text>
    <text x="558" y="142" font-size="12" fill="#4e5f6f">Queda dependencia temporal</text>
    <text x="558" y="160" font-size="12" fill="#4e5f6f">en los errores del modelo</text>
  </g>

  <g stroke="#9aa8b5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 142 L278 142"/>
    <path d="M272 138 L278 142 L272 146"/>
    <path d="M518 142 L538 142"/>
    <path d="M532 138 L538 142 L532 146"/>
  </g>
</svg>
