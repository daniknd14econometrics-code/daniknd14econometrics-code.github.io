<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Poisson completo y preguntas distribucionales sobre fecundidad</title>
  <desc id="desc">Una especificación Poisson completa conecta la distribución condicional con la media y con probabilidades de cero, exactamente tres y cuatro o más hijos. También compara la probabilidad de cero en el perfil promedio con el promedio de probabilidades individuales.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.accent{fill:#edf8f8;stroke:#b8dde2;stroke-width:1.5}.warm{fill:#fff7e6;stroke:#f0cf91;stroke-width:1.5}.head{font:700 24px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 15px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.value{font:800 27px system-ui,sans-serif;fill:#0b7285}.formula{font:700 20px Georgia,serif;fill:#0b5964}.arrow{stroke:#71879a;stroke-width:2;fill:none;marker-end:url(#a)}.barbg{fill:#e7edf2}.bar1{fill:#8fb8c2}.bar2{fill:#0b7285}.note{font:700 12px system-ui,sans-serif;fill:#0b5964}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#71879a"/></marker></defs>
  <rect class="bg" width="960" height="480" rx="18"/>
  <text class="head" x="42" y="44">Poisson completo permite responder preguntas distribucionales</text>
  <text class="sub" x="42" y="69">Número de hijos vivos · 4.361 mujeres · promedios sobre los perfiles observados</text>
  <rect class="accent" x="42" y="108" width="218" height="190" rx="15"/>
  <text class="label" x="65" y="141">Distribución condicional</text><text class="formula" x="65" y="178">P(Y = k | X)</text>
  <text class="small" x="65" y="207">La forma Poisson no fija</text><text class="small" x="65" y="225">solo E(Y|X): asigna masa</text><text class="small" x="65" y="243">a cada conteo posible.</text>
  <rect x="65" y="260" width="168" height="24" rx="12" fill="#17324d"/><text x="83" y="277" style="font:700 12px system-ui,sans-serif;fill:#fff">media predicha = 2,268</text>
  <path class="arrow" d="M260 202 L310 202"/>
  <rect class="panel" x="312" y="108" width="186" height="190" rx="15"/><text class="label" x="333" y="141">Cero hijos</text><text class="value" x="333" y="184">27,0%</text><text class="small" x="333" y="210">Promedio de</text><text class="small" x="333" y="228">P(Y=0 | Xᵢ)</text><rect x="333" y="254" width="138" height="10" rx="5" fill="#dfecef"/><rect x="333" y="254" width="93" height="10" rx="5" fill="#0b7285"/>
  <rect class="panel" x="516" y="108" width="186" height="190" rx="15"/><text class="label" x="537" y="141">Exactamente tres</text><text class="value" x="537" y="184">11,2%</text><text class="small" x="537" y="210">Promedio de</text><text class="small" x="537" y="228">P(Y=3 | Xᵢ)</text><rect x="537" y="254" width="138" height="10" rx="5" fill="#dfecef"/><rect x="537" y="254" width="39" height="10" rx="5" fill="#0b7285"/>
  <rect class="panel" x="720" y="108" width="198" height="190" rx="15"/><text class="label" x="741" y="141">Cuatro o más</text><text class="value" x="741" y="184">25,5%</text><text class="small" x="741" y="210">Promedio de</text><text class="small" x="741" y="228">P(Y≥4 | Xᵢ)</text><rect x="741" y="254" width="150" height="10" rx="5" fill="#dfecef"/><rect x="741" y="254" width="96" height="10" rx="5" fill="#0b7285"/>
  <rect class="warm" x="42" y="326" width="876" height="104" rx="14"/>
  <text class="label" x="65" y="357">La no linealidad cambia el resumen</text><text class="small" x="65" y="381">Probabilidad de cero hijos</text>
  <text class="small" x="318" y="381">En el perfil promedio X̄</text><rect class="barbg" x="318" y="394" width="220" height="13" rx="6"/><rect class="bar1" x="318" y="394" width="95" height="13" rx="6"/><text class="note" x="548" y="405">11,7%</text>
  <text class="small" x="626" y="381">Promedio de P(Y=0|Xᵢ)</text><rect class="barbg" x="626" y="394" width="220" height="13" rx="6"/><rect class="bar2" x="626" y="394" width="220" height="13" rx="6"/><text class="note" x="856" y="405">27,0%</text>
  <text class="small" x="65" y="454">Promediar probabilidades individuales no equivale a evaluar la probabilidad en el perfil promedio.</text>
</svg>
