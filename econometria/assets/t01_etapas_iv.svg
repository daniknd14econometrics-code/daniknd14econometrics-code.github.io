<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Primera etapa y forma reducida de la estrategia instrumental</title>
  <desc id="desc">Dos paneles muestran que una mayor mortalidad histórica se relaciona con menor protección institucional y con menor producto por habitante. Las relaciones condicionales estimadas son negativas.</desc>
  <rect width="1200" height="650" rx="24" fill="#f7fafb"/>
  <text x="58" y="52" fill="#18344d" font-family="Arial, sans-serif" font-size="27" font-weight="700">La identificación se construye en dos relaciones observables</text>
  <text x="58" y="82" fill="#5d7180" font-family="Arial, sans-serif" font-size="16">Mortalidad histórica, protección institucional y desarrollo · 53 países</text>

  <text x="100" y="122" fill="#263f52" font-family="Arial, sans-serif" font-size="19" font-weight="700">1. Primera etapa</text>
  <text x="690" y="122" fill="#263f52" font-family="Arial, sans-serif" font-size="19" font-weight="700">2. Forma reducida</text>
  <text x="100" y="145" fill="#5d7180" font-family="Arial, sans-serif" font-size="14">¿El instrumento mueve la variable endógena?</text>
  <text x="690" y="145" fill="#5d7180" font-family="Arial, sans-serif" font-size="14">¿El instrumento se relaciona con el resultado?</text>

