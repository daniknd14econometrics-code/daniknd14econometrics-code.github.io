<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Jerarquía y componentes de varianza</title>
  <desc id="desc">Años anidados en firmas y firmas en sectores junto con la descomposición de varianza del modelo multinivel ampliado.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 24px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 15px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.node{fill:#edf8f8;stroke:#0b7285;stroke-width:2}.firm{fill:#fff7e6;stroke:#d97706;stroke-width:2}.year{fill:#fff;stroke:#8ea1b2;stroke-width:1.5}.line{stroke:#9aabba;stroke-width:1.5}.sector{fill:#0b7285}.company{fill:#d97706}.resid{fill:#8ea1b2}.pct{font:800 22px system-ui,sans-serif;fill:#fff}.axis{stroke:#9aabba;stroke-width:1}.pill{fill:#f3f6f9;stroke:#dbe4ec}.value{font:800 22px system-ui,sans-serif;fill:#17324d}.note{font:700 12px system-ui,sans-serif;fill:#0b5964}
  </style>
  <rect class="bg" width="960" height="520" rx="18"/>
  <text class="head" x="42" y="44">La jerarquía convierte agrupamiento en un objeto econométrico</text>
  <text class="sub" x="42" y="69">Modelo ampliado · 35.989 observaciones · 7.283 firmas · 302 sectores CIIU4</text>
  <rect class="panel" x="38" y="94" width="405" height="380" rx="15"/>
  <rect class="panel" x="463" y="94" width="459" height="380" rx="15"/>
  <text class="label" x="64" y="128">A. Años dentro de firmas dentro de sectores</text>
  <rect class="node" x="171" y="151" width="138" height="42" rx="12"/><text class="label" x="201" y="177">Sector CIIU4</text>
  <line class="line" x1="240" y1="193" x2="134" y2="232"/><line class="line" x1="240" y1="193" x2="346" y2="232"/>
  <rect class="firm" x="73" y="232" width="122" height="41" rx="11"/><rect class="firm" x="285" y="232" width="122" height="41" rx="11"/>
  <text class="label" x="100" y="257">Firma i</text><text class="label" x="310" y="257">Firma j</text>
  <line class="line" x1="134" y1="273" x2="91" y2="316"/><line class="line" x1="134" y1="273" x2="134" y2="316"/><line class="line" x1="134" y1="273" x2="177" y2="316"/>
  <line class="line" x1="346" y1="273" x2="303" y2="316"/><line class="line" x1="346" y1="273" x2="346" y2="316"/><line class="line" x1="346" y1="273" x2="389" y2="316"/>
  <circle class="year" cx="91" cy="331" r="22"/><circle class="year" cx="134" cy="331" r="22"/><circle class="year" cx="177" cy="331" r="22"/><circle class="year" cx="303" cy="331" r="22"/><circle class="year" cx="346" cy="331" r="22"/><circle class="year" cx="389" cy="331" r="22"/>
  <text class="small" x="84" y="335">t1</text><text class="small" x="127" y="335">t2</text><text class="small" x="170" y="335">t3</text><text class="small" x="296" y="335">t1</text><text class="small" x="339" y="335">t2</text><text class="small" x="382" y="335">t3</text>
  <rect class="pill" x="65" y="384" width="351" height="62" rx="11"/><text class="note" x="82" y="408">POLS:</text><text class="small" x="126" y="408">no descompone los niveles.</text><text class="note" x="82" y="430">RE/FE firma:</text><text class="small" x="166" y="430">no separan el componente sectorial.</text>
  <text class="label" x="489" y="128">B. De dónde proviene la varianza residual</text>
  <rect class="sector" x="495" y="164" width="141" height="92" rx="9"/><rect class="company" x="636" y="164" width="220" height="92"/><rect class="resid" x="856" y="164" width="39" height="92" rx="0 9 9 0"/>
  <text class="pct" x="535" y="207">35,3%</text><text class="small" x="524" y="230" style="fill:#fff">sector</text>
  <text class="pct" x="714" y="207">55,0%</text><text class="small" x="699" y="230" style="fill:#fff">firma | sector</text>
  <text class="small" x="861" y="202" style="fill:#fff;font-weight:700">9,7</text><text class="small" x="861" y="218" style="fill:#fff;font-weight:700">%</text>
  <line class="axis" x1="495" y1="272" x2="895" y2="272"/>
  <rect class="pill" x="495" y="307" width="190" height="102" rx="12"/><text class="small" x="512" y="331">Dos firmas del mismo sector</text><text class="value" x="512" y="364">ICC = 0,353</text><text class="small" x="512" y="388">Comparten solo el sector</text>
  <rect class="pill" x="705" y="307" width="190" height="102" rx="12"/><text class="small" x="722" y="331">Dos años de la misma firma</text><text class="value" x="722" y="364">ICC = 0,903</text><text class="small" x="722" y="388">Comparten sector + firma</text>
  <text class="small" x="495" y="444">El ICC de firma es acumulado; no equivale al 55,0% puro de firma.</text>
</svg>
