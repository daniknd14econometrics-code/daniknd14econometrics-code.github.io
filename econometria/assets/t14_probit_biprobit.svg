<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">Participación laboral materna bajo probit y biprobit</title><desc id="desc">Probabilidades ajustadas e intervalos de confianza de trabajar para madres con hasta dos hijos y con más de dos hijos. El descenso es mayor bajo biprobit con instrumento.</desc>
<style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.h{font:700 27px system-ui,sans-serif;fill:#17324d}.s{font:500 14px system-ui,sans-serif;fill:#52677a}.l{font:700 18px system-ui,sans-serif;fill:#17324d}.g{stroke:#e5ebf0}.a{stroke:#aebbc6}.line{stroke:#2384e8;stroke-width:4;fill:none}.ci{stroke:#2384e8;stroke-width:3}.dot{fill:#2384e8}</style>
<rect class="bg" width="1040" height="570" rx="20"/><text class="h" x="46" y="48">Una endógena binaria cambia el modelo y la magnitud</text><text class="s" x="46" y="74">Probabilidad ajustada de trabajar según fecundidad · estimación e IC95%</text>
<rect class="p" x="46" y="100" width="455" height="390" rx="16"/><rect class="p" x="539" y="100" width="455" height="390" rx="16"/><text class="l" x="274" y="133" text-anchor="middle">Probit exógeno</text><text class="l" x="766" y="133" text-anchor="middle">Biprobit con instrumento</text>
<g class="g"><line x1="95" y1="180" x2="465" y2="180"/><line x1="95" y1="280" x2="465" y2="280"/><line x1="95" y1="380" x2="465" y2="380"/><line x1="588" y1="180" x2="958" y2="180"/><line x1="588" y1="280" x2="958" y2="280"/><line x1="588" y1="380" x2="958" y2="380"/></g>
<polyline class="line" points="155,183 407,366"/><line class="ci" x1="155" y1="171" x2="155" y2="195"/><circle class="dot" cx="155" cy="183" r="7"/><line class="ci" x1="407" y1="353" x2="407" y2="379"/><circle class="dot" cx="407" cy="366" r="7"/>
<polyline class="line" points="648,179 900,390"/><line class="ci" x1="648" y1="137" x2="648" y2="222"/><circle class="dot" cx="648" cy="179" r="7"/><line class="ci" x1="900" y1="324" x2="900" y2="456"/><circle class="dot" cx="900" cy="390" r="7"/>
<g class="s" text-anchor="middle"><text x="155" y="416">Hasta dos hijos</text><text x="407" y="416">Más de dos</text><text x="648" y="416">Hasta dos hijos</text><text x="900" y="416">Más de dos</text></g><g class="s"><text x="58" y="184">0,65</text><text x="58" y="284">0,55</text><text x="58" y="384">0,45</text><text x="551" y="184">0,70</text><text x="551" y="284">0,58</text><text x="551" y="384">0,46</text></g><text class="s" x="46" y="530">Cambio discreto: −0,109 en el probit exógeno frente a −0,256 en biprobit; la predicción relevante es Pr(trabaja=1).</text>
