<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Consistencia y normalidad asintótica de MCO</title><desc id="desc">Intervalos percentiles de la pendiente MCO que se estrechan con el tamaño muestral e histograma de la pendiente centrada y reescalada.</desc><rect width="1200" height="650" rx="22" fill="#f7fafb"/><text x="58" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#18344d">MCO se concentra y sus fluctuaciones se vuelven aproximadamente normales</text><text x="58" y="82" font-family="Arial" font-size="16" fill="#5d7180">Consistencia controla la distancia al parámetro; normalidad asintótica describe la distribución reescalada.</text><rect x="45" y="110" width="560" height="450" rx="16" fill="#fff" stroke="#dfe7eb"/><rect x="635" y="110" width="520" height="450" rx="16" fill="#fff" stroke="#dfe7eb"/><text x="70" y="147" font-family="Arial" font-size="19" font-weight="700" fill="#263f52">β̂ por tamaño muestral · P5–P95</text><text x="660" y="147" font-family="Arial" font-size="19" font-weight="700" fill="#263f52">√n(β̂−0,8) · 750 repeticiones</text><line x1="354" y1="170" x2="354" y2="505" stroke="#b34a66" stroke-width="2" stroke-dasharray="7 6"/><text x="365" y="190" font-family="Arial" font-size="13" fill="#b34a66">β=0,8</text>
