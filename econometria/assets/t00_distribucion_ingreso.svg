<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Distribución del ingreso antes y después del logaritmo</title><desc id="desc">Histogramas del ingreso horario en niveles, recortado visualmente en el percentil 99, y de su logaritmo.</desc>
