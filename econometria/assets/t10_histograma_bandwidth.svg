<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Histograma, densidad kernel y ancho de banda</title>
  <desc id="desc">Histograma del log ingreso con curva kernel y comparación de densidades con tres anchos de banda.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 24px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 15px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.axis{stroke:#9aabba;stroke-width:1.3}.grid{stroke:#e6edf2;stroke-width:1}.bar{fill:#87c5cf;opacity:.8}.kde{stroke:#0b7285;stroke-width:4;fill:none}.hsmall{stroke:#b23a48;stroke-width:3;fill:none}.hbase{stroke:#0b7285;stroke-width:4;fill:none}.hlarge{stroke:#d97706;stroke-width:3;fill:none}.pill{fill:#edf8f8;stroke:#b8dddd}.note{font:700 12px system-ui,sans-serif;fill:#0b5964}
  </style>
