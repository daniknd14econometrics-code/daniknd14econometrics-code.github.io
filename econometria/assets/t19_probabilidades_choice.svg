<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
<title id="title">Elección del método de inversión y probabilidades por cartera</title><desc id="desc">Probabilidades ajustadas e intervalos de confianza para carteras conservadora, mixta y más expuesta a acciones según la persona pueda elegir o no el método de inversión.</desc>
<style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.h{font:700 27px system-ui,sans-serif;fill:#17324d}.s{font:500 14px system-ui,sans-serif;fill:#52677a}.l{font:700 16px system-ui,sans-serif;fill:#17324d}.g{stroke:#e5ebf0}.line{stroke:#2384e8;stroke-width:4;fill:none}.ci{stroke:#2384e8;stroke-width:3}.dot{fill:#2384e8}</style>
<rect class="bg" width="1040" height="590" rx="20"/><text class="h" x="46" y="48">Poder elegir el método desplaza probabilidad hacia mayor exposición</text><text class="s" x="46" y="74">Probabilidades ajustadas del probit ordenado e IC95%</text>
<rect class="p" x="46" y="105" width="294" height="385" rx="16"/><rect class="p" x="373" y="105" width="294" height="385" rx="16"/><rect class="p" x="700" y="105" width="294" height="385" rx="16"/><text class="l" x="193" y="137" text-anchor="middle">Conservadora · 0%</text><text class="l" x="520" y="137" text-anchor="middle">Mixta · 50%</text><text class="l" x="847" y="137" text-anchor="middle">Más expuesta · 100%</text>
<g class="g"><line x1="80" y1="200" x2="310" y2="200"/><line x1="80" y1="300" x2="310" y2="300"/><line x1="80" y1="400" x2="310" y2="400"/><line x1="407" y1="200" x2="637" y2="200"/><line x1="407" y1="300" x2="637" y2="300"/><line x1="407" y1="400" x2="637" y2="400"/><line x1="734" y1="200" x2="964" y2="200"/><line x1="734" y1="300" x2="964" y2="300"/><line x1="734" y1="400" x2="964" y2="400"/></g>
<polyline class="line" points="112,273 274,350"/><line class="ci" x1="112" y1="210" x2="112" y2="336"/><line class="ci" x1="274" y1="306" x2="274" y2="394"/><circle class="dot" cx="112" cy="273" r="7"/><circle class="dot" cx="274" cy="350" r="7"/>
