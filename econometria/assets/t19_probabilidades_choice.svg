<polyline class="line" points="766,384 928,313"/><line class="ci" x1="766" y1="333" x2="766" y2="435"/><line class="ci" x1="928" y1="266" x2="928" y2="361"/><circle class="dot" cx="766" cy="384" r="7"/><circle class="dot" cx="928" cy="313" r="7"/>
<g class="s" text-anchor="middle"><text x="112" y="465">No elige</text><text x="274" y="465">Sí elige</text><text x="439" y="465">No elige</text><text x="601" y="465">Sí elige</text><text x="766" y="465">No elige</text><text x="928" y="465">Sí elige</text></g><text class="s" x="46" y="530">Cambio discreto: −12,8 pp en cartera conservadora, +1,0 pp en mixta y +11,8 pp en la categoría más expuesta.</text><text class="s" x="46" y="553">La amplitud de los intervalos refleja una muestra transversal de 194 hogares.</text>
