<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Diagnóstico de normalidad del residuo de primera etapa</title><desc id="desc">Histograma con cola derecha pronunciada y gráfico Q-Q con desviación marcada en la cola superior. La normalidad requerida por la función de control no resulta cómoda.</desc>
<style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.h{font:700 24px system-ui,sans-serif;fill:#17324d}.s{font:500 13px system-ui,sans-serif;fill:#52677a}.l{font:700 16px system-ui,sans-serif;fill:#17324d}.g{stroke:#e5ebf0}.a{stroke:#aebbc6}.bar{fill:#69b6c3}.curve{fill:none;stroke:#17324d;stroke-width:2.5}.ref{stroke:#9aabb7;stroke-width:2}.pt{fill:#2384e8}</style>
<rect class="bg" width="1040" height="500" rx="20"/><text class="h" x="44" y="44">La primera etapa deja una advertencia: el residuo no luce normal</text><text class="s" x="44" y="68">Diagnóstico visual secundario para la estrategia de función de control</text><rect class="p" x="44" y="92" width="458" height="342" rx="15"/><rect class="p" x="538" y="92" width="458" height="342" rx="15"/><text class="l" x="273" y="122" text-anchor="middle">Histograma y densidad normal</text><text class="l" x="767" y="122" text-anchor="middle">Q–Q frente a normal</text>
<line class="a" x1="86" y1="388" x2="466" y2="388"/><g class="g"><line x1="86" y1="310" x2="466" y2="310"/><line x1="86" y1="232" x2="466" y2="232"/><line x1="86" y1="154" x2="466" y2="154"/></g>
<g class="bar"><rect x="92" y="378" width="20" height="10"/><rect x="114" y="354" width="20" height="34"/><rect x="136" y="302" width="20" height="86"/><rect x="158" y="228" width="20" height="160"/><rect x="180" y="178" width="20" height="210"/><rect x="202" y="152" width="20" height="236"/><rect x="224" y="188" width="20" height="200"/><rect x="246" y="250" width="20" height="138"/><rect x="268" y="316" width="20" height="72"/><rect x="290" y="335" width="20" height="53"/><rect x="312" y="365" width="20" height="23"/><rect x="334" y="371" width="20" height="17"/><rect x="356" y="378" width="20" height="10"/><rect x="378" y="382" width="20" height="6"/><rect x="400" y="383" width="20" height="5"/><rect x="444" y="383" width="16" height="5"/></g><path class="curve" d="M92 372 C130 327 154 227 205 203 C250 182 279 300 311 350 C343 393 383 388 458 388"/><g class="s" text-anchor="middle"><text x="96" y="411">−20</text><text x="206" y="411">0</text><text x="316" y="411">20</text><text x="426" y="411">60</text></g>
<line class="a" x1="580" y1="388" x2="958" y2="388"/><line class="a" x1="580" y1="140" x2="580" y2="388"/><line class="ref" x1="615" y1="365" x2="920" y2="178"/><g class="pt"><circle cx="615" cy="337" r="4"/><circle cx="635" cy="326" r="4"/><circle cx="655" cy="314" r="4"/><circle cx="675" cy="301" r="4"/><circle cx="695" cy="287" r="4"/><circle cx="715" cy="274" r="4"/><circle cx="735" cy="261" r="4"/><circle cx="755" cy="248" r="4"/><circle cx="775" cy="235" r="4"/><circle cx="795" cy="223" r="4"/><circle cx="815" cy="211" r="4"/><circle cx="835" cy="198" r="4"/><circle cx="850" cy="186" r="4"/><circle cx="864" cy="176" r="4"/><circle cx="876" cy="166" r="4"/><circle cx="888" cy="157" r="4"/><circle cx="900" cy="149" r="4"/><circle cx="914" cy="143" r="4"/></g><g class="s" text-anchor="middle"><text x="615" y="411">−30</text><text x="767" y="411">0</text><text x="920" y="411">30</text></g><text class="s" x="44" y="470">La cola derecha y la curvatura del Q–Q aconsejan tratar la corrección CF como sensibilidad, no como reemplazo automático.</text>
