<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">Recorrido de la intensidad de I+D entre especificaciones de panel</title><desc id="desc">Coeficientes e intervalos de confianza para pooled, random effects, CRE Mundlak y fixed effects.</desc>
<style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe4ec;stroke-width:1.5}.head{font:700 25px system-ui,sans-serif;fill:#17324d}.sub{font:500 13px system-ui,sans-serif;fill:#52677a}.label{font:700 14px system-ui,sans-serif;fill:#17324d}.small{font:500 12px system-ui,sans-serif;fill:#52677a}.value{font:800 22px system-ui,sans-serif;fill:#0b7285}.axis{stroke:#aebbc6;stroke-width:1.2}.ci{stroke:#79bdc6;stroke-width:7;stroke-linecap:round}.ci2{stroke:#0b7285;stroke-width:8;stroke-linecap:round}.dot{fill:#17324d}.path{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:7 6}.zero{stroke:#d97706;stroke-dasharray:4 4}.pill{fill:#fff7e6;stroke:#f0cf91}</style>
<rect class="bg" width="960" height="530" rx="18"/><text class="head" x="42" y="45">La asociación se reduce al controlar heterogeneidad persistente</text><text class="sub" x="42" y="70">Intensidad de I+D · coeficientes e IC95%</text>
<rect class="panel" x="42" y="96" width="876" height="335" rx="16"/><line class="axis" x1="280" y1="374" x2="865" y2="374"/><line class="zero" x1="280" y1="130" x2="280" y2="384"/><text class="small" x="272" y="400">0</text><text class="small" x="426" y="400">0,2</text><text class="small" x="582" y="400">0,4</text><text class="small" x="738" y="400">0,6</text>
<path class="path" d="M757 157 L506 220 L432 283 L432 346"/>
<text class="label" x="70" y="160">Pooled cluster</text><line class="ci" x1="662" y1="157" x2="851" y2="157"/><circle class="dot" cx="757" cy="157" r="8"/><text class="value" x="715" y="145">0,611</text>
<text class="label" x="70" y="223">Random effects</text><line class="ci" x1="337" y1="220" x2="674" y2="220"/><circle class="dot" cx="506" cy="220" r="8"/><text class="value" x="521" y="210">0,289</text>
<text class="label" x="70" y="286">CRE / Mundlak</text><line class="ci2" x1="283" y1="283" x2="582" y2="283"/><circle class="dot" cx="432" cy="283" r="8"/><text class="value" x="447" y="273">0,195</text>
<text class="label" x="70" y="349">FE condicional</text><line class="ci2" x1="281" y1="346" x2="583" y2="346"/><circle class="dot" cx="432" cy="346" r="8"/><text class="value" x="447" y="336">0,195</text>
<rect class="pill" x="42" y="451" width="876" height="53" rx="14"/><text class="label" x="70" y="475">Mundlak: χ²(3)=58,25 · p&lt;0,001</text><text class="small" x="475" y="475">RE puro queda cuestionado; CRE y FE convergen.</text>
</svg>
