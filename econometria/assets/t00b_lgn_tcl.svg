<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">De la LGN al TCL</title><desc id="desc">Media acumulada de una variable chi cuadrado estabilizándose en dos y distribución de medias estandarizadas aproximándose a una normal.</desc><rect width="1200" height="630" rx="22" fill="#f7fafb"/><text x="58" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#18344d">Estabilización y distribución son dos resultados distintos</text><text x="58" y="82" font-family="Arial" font-size="16" fill="#5d7180">LGN: el promedio converge. TCL: sus fluctuaciones reescaladas adquieren una forma límite.</text><rect x="45" y="110" width="530" height="430" rx="16" fill="#fff" stroke="#dfe7eb"/><rect x="625" y="110" width="530" height="430" rx="16" fill="#fff" stroke="#dfe7eb"/><text x="70" y="147" font-family="Arial" font-size="19" font-weight="700" fill="#263f52">Media acumulada de χ²(2)</text><text x="650" y="147" font-family="Arial" font-size="19" font-weight="700" fill="#263f52">1.000 medias estandarizadas · n=40</text><line x1="80" y1="325" x2="545" y2="325" stroke="#b34a66" stroke-width="2" stroke-dasharray="7 6"/><text x="480" y="315" font-family="Arial" font-size="13" fill="#b34a66">E(W)=2</text><polyline points="80,500 95,350 110,205 130,290 150,225 185,283 220,332 270,330 330,336 390,329 445,330 495,326 545,328" fill="none" stroke="#225f7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#225f7d"><circle cx="80" cy="500" r="5"/><circle cx="110" cy="205" r="5"/><circle cx="220" cy="332" r="5"/><circle cx="330" cy="336" r="5"/><circle cx="545" cy="328" r="6"/></g><text x="385" y="365" font-family="Arial" font-size="14" fill="#225f7d">media final = 1,9828</text>
<line x1="660" y1="490" x2="1125" y2="490" stroke="#cad6dc"/><g fill="#7595a6"><path d="M665 490v0h24v0zm27 0v0h24v0zm27 0v-14h24v14zm27 0v-38h24v38zm27 0v-113h24v113zm27 0V298h24v192zm27 0V207h24v283zm27 0V208h24v282zm27 0V213h24v277zm27 0V284h24v206zm27 0V357h24v133zm27 0V398h24v92zm27 0V442h24v48zm27 0V475h24v15zm27 0V483h24v7zm27 0V486h24v4z"/></g><path d="M665 489 C740 480 760 420 805 330 C850 220 900 178 930 178 C975 178 1015 230 1050 330 C1085 420 1100 480 1125 489" fill="none" stroke="#b34a66" stroke-width="4"/><g font-family="Arial" font-size="13" fill="#667b89" text-anchor="middle"><text x="80" y="520">1</text><text x="300" y="520">1.000</text><text x="545" y="520">5.000</text><text x="310" y="542">Observaciones acumuladas</text><text x="680" y="518">−3</text><text x="895" y="518">0</text><text x="1110" y="518">+3</text><text x="895" y="540">Media estandarizada</text></g><text x="58" y="590" font-family="Arial" font-size="13" fill="#667b89">Fuente: Taller 2. Visual construido con los resultados simulados ya generados.</text><text x="58" y="611" font-family="Arial" font-size="13" fill="#667b89">TCL: media=-0,050; DE=0,997; asimetría=0,301. La curva normal es una referencia, no un ajuste exacto.</text></svg>
