<svg xmlns="http://www.w3.org/2000/svg" width="820" height="286" viewBox="0 0 820 286" role="img" aria-labelledby="title desc">
  <title id="title">T16 redistribución de probabilidad entre categorías</title>
  <desc id="desc">Resumen visual de cómo Educación, Experiencia y perfil demográfico reubican probabilidad entre Escuela, Hogar, Empleo white collar, Empleo blue collar y Servicios.</desc>

  <rect x="0" y="0" width="820" height="286" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f">
    <text x="24" y="30" font-size="15" font-weight="700">T16 - Redistribución de probabilidad por categorías</text>
    <text x="24" y="48" font-size="12" fill="#5a6a79">Resumen de dirección de cambios en el multinomial (sin sobrecargar con coeficientes)</text>
  </g>

  <g>
    <rect x="20" y="68" width="780" height="58" fill="#fbfcfd" stroke="#d7dfe6"/>
    <rect x="20" y="138" width="780" height="58" fill="#fbfcfd" stroke="#d7dfe6"/>
    <rect x="20" y="208" width="780" height="58" fill="#fbfcfd" stroke="#d7dfe6"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#24313f" font-size="12" font-weight="700">
    <text x="34" y="91">Educación</text>
    <text x="34" y="161">Experiencia</text>
    <text x="34" y="229">Perfil demográfico</text>
    <text x="34" y="245" font-size="11" font-weight="400" fill="#5a6a79">(persona negra vs no negra)</text>
  </g>

  <g>
    <rect x="180" y="78" width="250" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>
    <rect x="470" y="78" width="310" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>

    <rect x="180" y="148" width="250" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>
    <rect x="470" y="148" width="310" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>

    <rect x="180" y="218" width="250" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>
    <rect x="470" y="218" width="310" height="38" rx="6" fill="#f4f6f8" stroke="#d3dce4"/>
  </g>

  <g stroke="#8fa0af" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="438" y1="97" x2="462" y2="97"/>
    <path d="M456 92 L462 97 L456 102"/>

    <line x1="438" y1="167" x2="462" y2="167"/>
    <path d="M456 162 L462 167 L456 172"/>

    <line x1="438" y1="237" x2="462" y2="237"/>
    <path d="M456 232 L462 237 L456 242"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5">
    <text x="194" y="93" fill="#5a6a79" font-weight="700">Pierde probabilidad</text>
    <text x="194" y="109" fill="#24313f">Hogar, Empleo blue collar, Servicios</text>
    <text x="484" y="93" fill="#2f4558" font-weight="700">Gana probabilidad</text>
    <text x="484" y="109" fill="#24313f">Escuela, Empleo white collar</text>

    <text x="194" y="163" fill="#5a6a79" font-weight="700">Pierde probabilidad</text>
    <text x="194" y="179" fill="#24313f">Escuela, Hogar</text>
    <text x="484" y="163" fill="#2f4558" font-weight="700">Gana probabilidad</text>
    <text x="484" y="179" fill="#24313f">Empleo white collar, Empleo blue collar, Servicios</text>

    <text x="194" y="233" fill="#5a6a79" font-weight="700">Pierde probabilidad</text>
    <text x="194" y="249" fill="#24313f">Escuela, Empleo white collar, Empleo blue collar</text>
    <text x="484" y="233" fill="#2f4558" font-weight="700">Gana probabilidad</text>
    <text x="484" y="249" fill="#24313f">Hogar, Servicios</text>
  </g>

  <text x="24" y="279" font-family="Arial, Helvetica, sans-serif" font-size="10.8" fill="#5a6a79">Nota de lectura: Servicios muestra menor separación en diagnósticos de clasificación dentro de esta base.</text>
</svg>
