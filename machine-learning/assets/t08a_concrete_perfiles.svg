<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
<title id="title">Perfiles parciales cualitativos del concreto</title><desc id="desc">Síntesis cualitativa de la curvatura reportada para edad, agua, cemento y escoria de alto horno.</desc>
<rect width="880" height="560" rx="24" fill="#f7f4ee"/><text x="48" y="54" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">La curvatura aparece donde la recta compromete regiones</text><text x="48" y="82" font-family="Arial" font-size="15" fill="#536575">Perfiles parciales cualitativos reportados en el informe</text>
<g font-family="Arial" font-size="15" fill="#17324d"><g transform="translate(48,120)"><text font-weight="700">Age</text><line y1="170" x2="350" y2="170" stroke="#9aa9b5"/><line y1="20" y2="170" stroke="#9aa9b5"/><path d="M8 155 C65 125 85 70 135 48 C190 30 245 38 342 36" fill="none" stroke="#1b7892" stroke-width="5"/><text y="198" font-size="12" fill="#536575">aumenta fuerte y luego se aplana</text></g>
<g transform="translate(482,120)"><text font-weight="700">Water</text><line y1="170" x2="350" y2="170" stroke="#9aa9b5"/><line y1="20" y2="170" stroke="#9aa9b5"/><path d="M8 35 C70 45 110 70 155 86 C215 110 260 132 342 145" fill="none" stroke="#e1813b" stroke-width="5"/><text y="198" font-size="12" fill="#536575">descenso con cambios de pendiente</text></g>
<g transform="translate(48,350)"><text font-weight="700">Cement</text><line y1="150" x2="350" y2="150" stroke="#9aa9b5"/><line y2="150" stroke="#9aa9b5"/><path d="M8 132 C75 120 125 95 170 78 C225 58 270 48 342 35" fill="none" stroke="#1b7892" stroke-width="5"/><text y="178" font-size="12" fill="#536575">relación positiva, no perfectamente lineal</text></g>
<g transform="translate(482,350)"><text font-weight="700">BlastFurnaceSlag</text><line y1="150" x2="350" y2="150" stroke="#9aa9b5"/><line y2="150" stroke="#9aa9b5"/><path d="M8 132 C70 112 120 88 170 70 C230 52 280 52 342 55" fill="none" stroke="#e1813b" stroke-width="5"/><text y="178" font-size="12" fill="#536575">crece y encuentra una meseta</text></g></g>
<text x="48" y="542" font-family="Arial" font-size="12" fill="#536575">Síntesis cualitativa de perfiles; no son curvas reestimadas para esta pieza.</text></svg>
