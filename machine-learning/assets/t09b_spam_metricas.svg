<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Métricas externas para clasificación de spam</title><desc id="desc">Random Forest supera a Bagging y CART en error, AUC y Brier sobre el test común.</desc><rect width="900" height="560" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">El bosque mejora la decisión y el score</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Test externo de 1.536 mensajes · las escalas se separan por métrica</text><g font-family="Arial" font-size="14" fill="#17324d"><g transform="translate(48,120)"><text font-weight="700">Error 0–1 · menor</text><rect y="30" width="170" height="28" rx="5" fill="#536575"/><text x="180" y="50">CART 0,0775</text><rect y="72" width="131" height="28" rx="5" fill="#d39a65"/><text x="141" y="92">Bagging 0,0599</text><rect y="114" width="107" height="28" rx="5" fill="#e1813b"/><text x="117" y="134">RF 0,0488</text></g><g transform="translate(315,120)"><text font-weight="700">ROC-AUC · mayor</text><rect y="30" width="227" height="28" rx="5" fill="#536575"/><text x="237" y="50">CART 0,9420</text><rect y="72" width="236" height="28" rx="5" fill="#d39a65"/><text x="246" y="92">Bagging 0,9807</text><rect y="114" width="237" height="28" rx="5" fill="#e1813b"/><text x="247" y="134">RF 0,9841</text></g><g transform="translate(582,120)"><text font-weight="700">Brier · menor</text><rect y="30" width="168" height="28" rx="5" fill="#536575"/><text x="178" y="50">CART 0,0677</text><rect y="72" width="110" height="28" rx="5" fill="#d39a65"/><text x="120" y="92">Bagging 0,0442</text><rect y="114" width="100" height="28" rx="5" fill="#e1813b"/><text x="110" y="134">RF 0,0402</text></g></g><rect x="48" y="330" width="804" height="115" rx="14" fill="#eaf2f8" stroke="#1b7892"/><text x="72" y="365" font-family="Arial" font-size="16" font-weight="700" fill="#17324d">75 errores con RF · 31 falsos positivos · 44 falsos negativos</text><text x="72" y="397" font-family="Arial" font-size="14" fill="#536575">La mejora no proviene de sacrificar una de las dos clases.</text><text x="48" y="500" font-family="Arial" font-size="13" fill="#536575">Las métricas describen este test; OOB se usó antes para seleccionar m.</text></svg>
