<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Deviance Poisson en fertil2</title><desc id="desc">Natural Splines, GAM y Random Forest superan al GLM Poisson lineal bajo deviance Poisson.</desc><rect width="900" height="500" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">La forma funcional explica la mayor parte de la ganancia</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Deviance Poisson media en el test protegido · menor es mejor</text><g font-family="Arial" font-size="15" fill="#17324d"><text x="48" y="145">GLM Poisson</text><rect x="220" y="120" width="470" height="36" rx="6" fill="#8d9aa4"/><text x="710" y="145">0,9733</text><text x="48" y="205">Lasso</text><rect x="220" y="180" width="467" height="36" rx="6" fill="#6e8c9b"/><text x="707" y="205">0,9668</text><text x="48" y="265">CART</text><rect x="220" y="240" width="421" height="36" rx="6" fill="#536575"/><text x="661" y="265">0,8747</text><text x="48" y="325">Random Forest</text><rect x="220" y="300" width="385" height="36" rx="6" fill="#d39a65"/><text x="625" y="325">0,8005</text><text x="48" y="385">GAM</text><rect x="220" y="360" width="383" height="36" rx="6" fill="#1b7892"/><text x="623" y="385">0,7955</text><text x="48" y="445">Splines</text><rect x="220" y="420" width="381" height="36" rx="6" fill="#e1813b"/><text x="621" y="445">0,7929</text></g></svg>
