<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">De CART a Random Forest en spam</title><desc id="desc">La progresión agrega bootstrap y luego decorrelación, reduciendo inestabilidad y error con menor interpretabilidad estructural.</desc><rect width="900" height="470" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Tres reglas para convertir score en decisión más estable</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">CART → Bagging → Random Forest</text><g font-family="Arial" font-size="15" fill="#17324d"><rect x="55" y="145" width="220" height="170" rx="14" fill="#eaf2f8" stroke="#1b7892" stroke-width="2"/><text x="135" y="185" font-weight="700">CART</text><text x="82" y="220">reglas visibles</text><text x="82" y="248">score por hoja</text><text x="82" y="276">inestable</text><rect x="340" y="145" width="220" height="170" rx="14" fill="#fbefe4" stroke="#d39a65" stroke-width="2"/><text x="410" y="185" font-weight="700">Bagging</text><text x="367" y="220">bootstrap</text><text x="367" y="248">muchos votos</text><text x="367" y="276">menos variación</text><rect x="625" y="145" width="220" height="170" rx="14" fill="#fbefe4" stroke="#e1813b" stroke-width="2"/><text x="696" y="185" font-weight="700">RF</text><text x="652" y="220">bootstrap</text><text x="652" y="248">+ predictores aleatorios</text><text x="652" y="276">más diversidad</text><path d="M280 230 H330" stroke="#536575" stroke-width="3" marker-end="url(#a)"/><path d="M565 230 H615" stroke="#536575" stroke-width="3" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#536575"/></marker></defs><text x="55" y="380" font-family="Arial" font-size="14" fill="#536575">La ganancia es predictiva: la explicación pasa de un árbol a diagnósticos agregados.</text></svg>
