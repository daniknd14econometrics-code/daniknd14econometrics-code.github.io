<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">MSE externo de California Housing</title><desc id="desc">Random Forest y Bagging presentan menor MSE de test que CART y el benchmark de media.</desc><rect width="900" height="520" rx="24" fill="#f7f4ee"/><text x="48" y="54" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">La estabilidad del ensamble se ve en el error externo</text><text x="48" y="84" font-family="Arial" font-size="15" fill="#536575">MSE sobre 4.128 observaciones de test · menor es mejor</text><g font-family="Arial" font-size="15" fill="#17324d"><text x="48" y="150">Benchmark</text><rect x="180" y="125" width="610" height="38" rx="6" fill="#8d9aa4"/><text x="805" y="150">1,2935</text><text x="48" y="215">CART grande</text><rect x="180" y="190" width="187" height="38" rx="6" fill="#536575"/><text x="382" y="215">0,3959</text><text x="48" y="280">CART-min</text><rect x="180" y="255" width="184" height="38" rx="6" fill="#1b7892"/><text x="379" y="280">0,3886</text><text x="48" y="345">CART-1SE</text><rect x="180" y="320" width="191" height="38" rx="6" fill="#6e8c9b"/><text x="386" y="345">0,4047</text><text x="48" y="410">Bagging</text><rect x="180" y="385" width="123" height="38" rx="6" fill="#d39a65"/><text x="318" y="410">0,2603</text><text x="500" y="410">Random Forest</text><rect x="665" y="385" width="116" height="38" rx="6" fill="#e1813b"/><text x="796" y="410">0,2464</text></g><text x="48" y="472" font-family="Arial" font-size="13" fill="#536575">La comparación mantiene la misma partición protegida; el tuning ocurrió antes de abrir el test.</text></svg>
