<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" role="img" aria-labelledby="title desc"><title id="title">Default: errores de Logit según el umbral</title><desc id="desc">Para umbrales 1/3, 1/2 y 2/3: defaults detectados 160, 106 y 65; omitidos 173, 227 y 268; falsas alarmas 109, 39 y 16.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="880" height="526" rx="18" fill="#f8fafc"/><text x="28" y="40" font-size="25" fill="#17324d" font-weight="700" text-anchor="start">El umbral redistribuye los errores</text><text x="28" y="70" font-size="17" fill="#5d6b78" font-weight="400" text-anchor="start">Logit · mismas 10.000 probabilidades externas</text><rect x="22" y="94" width="836" height="344" rx="14" fill="#fff"/><rect x="43" y="117" width="13" height="13" rx="4" fill="#0b7285"/><text x="66" y="129" font-size="16" fill="#17324d" font-weight="400" text-anchor="start">Default detectado</text><rect x="248" y="117" width="13" height="13" rx="4" fill="#dbe4ec"/><text x="271" y="129" font-size="16" fill="#17324d" font-weight="400" text-anchor="start">Default omitido</text><rect x="601" y="117" width="13" height="13" rx="4" fill="#b76514"/><text x="624" y="129" font-size="16" fill="#17324d" font-weight="400" text-anchor="start">Falsa alarma</text><text x="44" y="171" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Umbral</text><text x="185" y="171" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">333 defaults observados</text><text x="604" y="171" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Entre 9.667 no defaults</text><text x="50" y="222" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">1/3</text><rect x="185" y="198" width="350" height="38" rx="4" fill="#dbe4ec"/><rect x="185" y="198" width="168.16816816816817" height="38" rx="4" fill="#0b7285"/><text x="269.0840840840841" y="223" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">160</text><text x="444.0840840840841" y="223" font-size="17" fill="#17324d" font-weight="600" text-anchor="middle">173</text><rect x="604" y="198" width="154.41666666666666" height="38" rx="4" fill="#b76514"/><text x="768.4166666666666" y="223" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">109</text><text x="50" y="295" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">1/2</text><rect x="185" y="271" width="350" height="38" rx="4" fill="#dbe4ec"/><rect x="185" y="271" width="111.41141141141141" height="38" rx="4" fill="#0b7285"/><text x="240.7057057057057" y="296" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">106</text><text x="415.70570570570567" y="296" font-size="17" fill="#17324d" font-weight="600" text-anchor="middle">227</text><rect x="604" y="271" width="55.25" height="38" rx="4" fill="#b76514"/><text x="669.25" y="296" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">39</text><text x="50" y="368" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">2/3</text><rect x="185" y="344" width="350" height="38" rx="4" fill="#dbe4ec"/><rect x="185" y="344" width="68.31831831831832" height="38" rx="4" fill="#0b7285"/><text x="219.15915915915917" y="369" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">65</text><text x="394.1591591591591" y="369" font-size="17" fill="#17324d" font-weight="600" text-anchor="middle">268</text><rect x="604" y="344" width="22.666666666666668" height="38" rx="4" fill="#b76514"/><text x="636.6666666666666" y="369" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">16</text><text x="28" y="474" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">Menor umbral: más detección y más falsas alarmas.</text><text x="28" y="503" font-size="15" fill="#5d6b78" font-weight="400" text-anchor="start">Conteos del informe. Las barras de la derecha usan su propia escala.</text></g></svg>
