<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc"><title id="title">NIRsoil: RMSE externo</title><desc id="desc">RMSE outer-OOF: Elastic Net 0,5721; Lasso 0,5760; Ridge 0,6284; media 1,1950.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="880" height="460" rx="18" fill="#f8fafc"/><text x="28" y="42" font-size="25" font-weight="700" fill="#17324d">Elastic Net gana por poco a Lasso</text><text x="28" y="72" font-size="17" fill="#5d6b78">NIRsoil · RMSE externo sobre 645 predicciones outer-OOF</text><rect x="22" y="96" width="836" height="260" rx="14" fill="#fff"/><path d="M235 140V315M400 140V315M565 140V315M730 140V315" stroke="#dce3e9"/><text x="235" y="338" text-anchor="middle" font-size="15" fill="#5d6b78">0,4</text><text x="400" y="338" text-anchor="middle" font-size="15" fill="#5d6b78">0,7</text><text x="565" y="338" text-anchor="middle" font-size="15" fill="#5d6b78">1,0</text><text x="730" y="338" text-anchor="middle" font-size="15" fill="#5d6b78">1,3</text><g font-size="17" font-weight="700" fill="#17324d"><text x="44" y="180">Elastic Net</text><text x="44" y="225">Lasso</text><text x="44" y="270">Ridge</text><text x="44" y="315">Media</text></g><rect x="235" y="159" width="95" height="22" rx="4" fill="#0b7285"/><rect x="235" y="204" width="97" height="22" rx="4" fill="#0b7285"/><rect x="235" y="249" width="126" height="22" rx="4" fill="#b76514"/><rect x="235" y="294" width="437" height="22" rx="4" fill="#aebbc5"/><g font-size="16" font-weight="700" fill="#17324d"><text x="342" y="177">0,5721</text><text x="344" y="222">0,5760</text><text x="373" y="267">0,6284</text><text x="684" y="312">1,1950</text></g><text x="28" y="397" font-size="18" font-weight="700" fill="#17324d">La mejora frente a Lasso es pequeña y no uniforme por fold.</text><text x="28" y="427" font-size="15" fill="#5d6b78">La media es la referencia; los predictores aportan una mejora grande.</text></g></svg>
