<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Cobertura y ancho del intervalo cuantílico central</title><desc id="desc">Comparación de cobertura y ancho medio del intervalo entre los cuantiles 0,20 y 0,80.</desc><rect width="900" height="430" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Cobertura y precisión son diagnósticos diferentes</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Intervalo central nominal del 60 % en el test protegido</text><line x1="130" y1="330" x2="780" y2="330" stroke="#9aa9b5" stroke-width="2"/><line x1="130" y1="120" x2="130" y2="330" stroke="#9aa9b5" stroke-width="2"/><line x1="130" y1="204" x2="780" y2="204" stroke="#d39a65" stroke-dasharray="6 5" stroke-width="2"/><text x="70" y="209" font-family="Arial" font-size="13" fill="#536575">60 %</text><g font-family="Arial" font-size="15" fill="#17324d"><circle cx="400" cy="185" r="12" fill="#e1813b"/><text x="420" y="190">QRF: 62,75 % · ancho 26,86</text><circle cx="330" cy="228" r="12" fill="#1b7892"/><text x="350" y="233">QR: 61,02 % · ancho 28,39</text></g><text x="48" y="390" font-family="Arial" font-size="13" fill="#536575">Un intervalo más estrecho no es automáticamente mejor: debe leerse junto con su cobertura.</text></svg>
