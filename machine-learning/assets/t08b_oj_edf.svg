<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc"><title id="title">Grados de libertad efectivos del GAM de OJ</title><desc id="desc">Los tres términos suavizados quedan cerca de un grado de libertad en casi todos los pliegues; PriceDiff alcanza 4.71 en un pliegue.</desc><rect width="880" height="500" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">La penalización devuelve casi todos los perfiles a una recta</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">edf por pliegue externo; el último punto resume el ajuste final</text><g transform="translate(80,120)" font-family="Arial" font-size="13" fill="#536575"><line y1="260" x2="720" y2="260" stroke="#9aa9b5"/><line y2="260" stroke="#9aa9b5"/><line y1="208" x2="720" y2="208" stroke="#d6d0c7" stroke-dasharray="5 5"/><text x="-35" y="213">1</text><text x="-35" y="9">5</text><g fill="#1b7892"><circle cx="90" cy="208" r="6"/><circle cx="225" cy="208" r="6"/><circle cx="360" cy="208" r="6"/><circle cx="495" cy="208" r="6"/><circle cx="630" cy="208" r="6"/><circle cx="720" cy="208" r="6"/></g><g fill="#e1813b"><circle cx="90" cy="208" r="6"/><circle cx="225" cy="18" r="7"/><circle cx="360" cy="208" r="6"/><circle cx="495" cy="208" r="6"/><circle cx="630" cy="208" r="6"/><circle cx="720" cy="208" r="6"/></g><g fill="#8d9aa4"><circle cx="90" cy="208" r="6"/><circle cx="225" cy="208" r="6"/><circle cx="360" cy="208" r="6"/><circle cx="495" cy="208" r="6"/><circle cx="630" cy="208" r="6"/><circle cx="720" cy="208" r="6"/></g><g fill="#536575"><text x="75" y="286">F1</text><text x="210" y="286">F2</text><text x="345" y="286">F3</text><text x="480" y="286">F4</text><text x="615" y="286">F5</text><text x="700" y="286">final</text></g><g font-size="14" fill="#17324d"><rect x="40" y="330" width="14" height="14" fill="#1b7892"/><text x="62" y="342">LoyalCH</text><rect x="160" y="330" width="14" height="14" fill="#e1813b"/><text x="182" y="342">PriceDiff</text><rect x="295" y="330" width="14" height="14" fill="#8d9aa4"/><text x="317" y="342">WeekofPurchase</text></g></g><text x="80" y="463" font-family="Arial" font-size="13" fill="#536575">Solo PriceDiff en F2 conserva curvatura apreciable (edf ≈ 4.71); no equivale a una selección causal.</text></svg>
