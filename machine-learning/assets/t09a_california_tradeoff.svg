<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Trade-off entre interpretabilidad y estabilidad</title><desc id="desc">CART conserva una estructura legible; Bagging reduce variabilidad y Random Forest añade decorrelación con menor interpretabilidad estructural.</desc><rect width="900" height="470" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Más estabilidad, menos camino único para explicar</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Lectura conceptual de la progresión del informe</text><g font-family="Arial" font-size="15" fill="#17324d"><line x1="140" y1="370" x2="780" y2="370" stroke="#9aa9b5" stroke-width="2"/><line x1="140" y1="370" x2="140" y2="120" stroke="#9aa9b5" stroke-width="2"/><text x="650" y="405">estabilidad predictiva →</text><text transform="translate(55,210) rotate(-90)">interpretabilidad estructural →</text><circle cx="255" cy="155" r="48" fill="#1b7892"/><text x="220" y="160" fill="white" font-weight="700">CART</text><text x="185" y="235">un árbol, un camino</text><circle cx="470" cy="240" r="55" fill="#d39a65"/><text x="432" y="245" fill="white" font-weight="700">Bagging</text><text x="416" y="320">promedio bootstrap</text><circle cx="690" cy="315" r="62" fill="#e1813b"/><text x="657" y="320" fill="white" font-weight="700">RF</text><text x="620" y="395">bootstrap + decorrelación</text></g><path d="M305 175 C365 195 390 220 415 235" fill="none" stroke="#536575" stroke-width="3" marker-end="url(#a)"/><path d="M530 270 C590 285 620 300 635 307" fill="none" stroke="#536575" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#536575"/></marker></defs></svg>
