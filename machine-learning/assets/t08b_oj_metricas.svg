<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de métricas fuera de muestra para OJ</title>
  <desc id="desc">Logit lineal, GAM penalizado y natural splines tienen resultados muy próximos; el Logit presenta el mejor valor observado en las tres métricas.</desc>
  <rect width="900" height="520" rx="24" fill="#f7f4ee"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">La flexibilidad no mejora la decisión fuera de muestra</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="15" fill="#536575">Promedios OOF de cinco pliegues agrupados por tienda y semana</text>
  <g font-family="Arial, sans-serif" fill="#17324d">
    <text x="48" y="135" font-size="13" font-weight="700" fill="#536575">MODELO</text><text x="360" y="135" font-size="13" font-weight="700" fill="#536575">LOG-LOSS ↓</text><text x="530" y="135" font-size="13" font-weight="700" fill="#536575">BRIER ↓</text><text x="680" y="135" font-size="13" font-weight="700" fill="#536575">ROC-AUC ↑</text>
    <rect x="48" y="155" width="804" height="64" rx="10" fill="#eaf2f8"/><text x="72" y="193" font-size="18" font-weight="700">Logit</text><text x="375" y="193" font-size="20" font-weight="700" fill="#1b7892">0,4060</text><text x="545" y="193" font-size="20" font-weight="700" fill="#1b7892">0,1267</text><text x="695" y="193" font-size="20" font-weight="700" fill="#1b7892">0,8909</text>
    <rect x="48" y="232" width="804" height="64" rx="10" fill="#fff" stroke="#d6d0c7"/><text x="72" y="270" font-size="18" font-weight="700">GAM penalizado</text><text x="375" y="270" font-size="20">0,4072</text><text x="545" y="270" font-size="20">0,1274</text><text x="695" y="270" font-size="20">0,8900</text>
    <rect x="48" y="309" width="804" height="64" rx="10" fill="#fff" stroke="#d6d0c7"/><text x="72" y="347" font-size="18" font-weight="700">Natural splines</text><text x="375" y="347" font-size="20">0,4168</text><text x="545" y="347" font-size="20">0,1301</text><text x="695" y="347" font-size="20">0,8855</text>
  </g>
  <rect x="48" y="410" width="804" height="60" rx="12" fill="#fff3e8" stroke="#e1813b"/>
  <text x="72" y="447" font-family="Arial, sans-serif" font-size="15" fill="#5a4030">Permitir curvatura no compensa el costo de complejidad en esta muestra.</text>
</svg>
