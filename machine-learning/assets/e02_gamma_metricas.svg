<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gamma deviance y RMSE en loanapp</title><desc id="desc">Random Forest gana en Gamma deviance, mientras CART mínimo CV obtiene el menor RMSE.</desc><rect width="900" height="520" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">“Mejor” depende de la pérdida que define el objetivo</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">Comparación externa en la misma muestra protegida</text><g font-family="Arial" font-size="14" fill="#17324d"><text x="48" y="130" font-weight="700">Gamma deviance · menor</text><text x="48" y="170">GLM</text><rect x="120" y="150" width="240" height="26" rx="4" fill="#8d9aa4"/><text x="372" y="169">0,1727</text><text x="48" y="210">CART</text><rect x="120" y="190" width="172" height="26" rx="4" fill="#536575"/><text x="304" y="209">0,1240</text><text x="48" y="250">GAM</text><rect x="120" y="230" width="161" height="26" rx="4" fill="#1b7892"/><text x="293" y="249">0,1162</text><text x="48" y="290">RF</text><rect x="120" y="270" width="146" height="26" rx="4" fill="#e1813b"/><text x="278" y="289">0,1051</text><text x="490" y="130" font-weight="700">RMSE · menor</text><text x="490" y="170">GLM</text><rect x="560" y="150" width="180" height="26" rx="4" fill="#8d9aa4"/><text x="750" y="169">84,61</text><text x="490" y="210">RF</text><rect x="560" y="190" width="166" height="26" rx="4" fill="#d39a65"/><text x="736" y="209">78,16</text><text x="490" y="250">CART</text><rect x="560" y="230" width="165" height="26" rx="4" fill="#e1813b"/><text x="735" y="249">77,77</text></g><rect x="48" y="350" width="804" height="92" rx="14" fill="#eaf2f8" stroke="#1b7892"/><text x="72" y="387" font-family="Arial" font-size="16" font-weight="700" fill="#17324d">Gamma deviance premia RF · RMSE premia CART</text><text x="72" y="416" font-family="Arial" font-size="14" fill="#536575">La función de pérdida no es un detalle posterior: define qué significa mejorar.</text></svg>
