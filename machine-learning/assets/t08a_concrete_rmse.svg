<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">RMSE fuera de muestra para el concreto</title><desc id="desc">Comparación del benchmark de media, MCO, splines naturales y GAM penalizado usando validación agrupada por receta.</desc><rect width="880" height="480" rx="24" fill="#f7f4ee"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">La recta mejora el benchmark; la flexibilidad captura el resto</text><text x="48" y="80" font-family="Arial" font-size="15" fill="#536575">RMSE medio en cinco pliegues externos agrupados por receta · MPa</text><g font-family="Arial" font-size="15" fill="#17324d"><text x="48" y="145">Media</text><rect x="170" y="122" width="560" height="34" rx="5" fill="#8d9aa4"/><text x="745" y="145">16.77</text><text x="48" y="205">MCO</text><rect x="170" y="182" width="352" height="34" rx="5" fill="#536575"/><text x="537" y="205">10.55</text><text x="48" y="265">Splines naturales</text><rect x="170" y="242" width="224" height="34" rx="5" fill="#1b7892"/><text x="409" y="265">6.71</text><text x="48" y="325">GAM penalizado</text><rect x="170" y="302" width="202" height="34" rx="5" fill="#e1813b"/><text x="387" y="325">6.06</text></g><text x="48" y="410" font-family="Arial" font-size="13" fill="#536575">Escala visual común; menor RMSE implica menor error predictivo fuera de muestra.</text></svg>
