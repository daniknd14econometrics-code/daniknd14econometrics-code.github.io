<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de estimadores en WAGEPAN</title>
  <desc id="desc">TWFE estima cero coma 1024, primeras diferencias cero coma 0593 y WAS cero coma 0412. El intervalo de WAS incluye cero.</desc>
  <rect width="1100" height="500" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#15324a">La estimación cae al cambiar la comparación</text>
  <text x="550" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">WAGEPAN: efecto estimado de la afiliación sindical sobre el logaritmo del salario</text>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="250" y1="115" x2="250" y2="405"/><line x1="403" y1="115" x2="403" y2="405"/>
    <line x1="556" y1="115" x2="556" y2="405"/><line x1="709" y1="115" x2="709" y2="405"/>
    <line x1="862" y1="115" x2="862" y2="405"/><line x1="1015" y1="115" x2="1015" y2="405"/>
  </g>
  <line x1="403" y1="105" x2="403" y2="410" stroke="#8293a1" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#314858">
    <text x="40" y="169">TWFE</text><text x="40" y="269">Primeras diferencias</text><text x="40" y="369">WAS</text>
  </g>
  <g stroke="#277da1" stroke-width="5" stroke-linecap="round">
    <line x1="542" y1="162" x2="891" y2="162"/><line x1="403" y1="262" x2="766" y2="262"/><line x1="341" y1="362" x2="717" y2="362"/>
  </g>
  <g stroke="#277da1" stroke-width="3">
    <line x1="542" y1="151" x2="542" y2="173"/><line x1="891" y1="151" x2="891" y2="173"/>
    <line x1="403" y1="251" x2="403" y2="273"/><line x1="766" y1="251" x2="766" y2="273"/>
    <line x1="341" y1="351" x2="341" y2="373"/><line x1="717" y1="351" x2="717" y2="373"/>
  </g>
  <circle cx="716" cy="162" r="10" fill="#15324a"/>
  <circle cx="584" cy="262" r="10" fill="#277da1"/>
  <circle cx="529" cy="362" r="10" fill="#d95f76"/>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="735" y="168" fill="#15324a">0,1024</text><text x="603" y="268" fill="#15324a">0,0593</text><text x="548" y="368" fill="#9f3049">0,0412</text>
  </g>
  <line x1="250" y1="410" x2="1015" y2="410" stroke="#8293a1" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#526575" text-anchor="middle">
    <text x="250" y="436">−0,05</text><text x="403" y="436">0</text><text x="556" y="436">0,05</text><text x="709" y="436">0,10</text><text x="862" y="436">0,15</text><text x="1015" y="436">0,20</text>
  </g>
  <text x="632" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">Estimación e intervalo de confianza de 95%</text>
</svg>
