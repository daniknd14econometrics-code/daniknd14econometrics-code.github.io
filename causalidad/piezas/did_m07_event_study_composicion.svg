<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Dinámica pos-tratamiento y composición de cohortes</title>
  <desc id="desc">Comparación entre el event study que utiliza todas las cohortes disponibles en cada horizonte y una versión balanceada hasta el horizonte uno que conserva las cohortes 2004 y 2006.</desc>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#18344d}.sub{font:400 15px system-ui,sans-serif;fill:#5d7180}
    .panel{font:700 19px system-ui,sans-serif;fill:#263f52}.label{font:600 15px system-ui,sans-serif;fill:#314858}
    .small{font:400 13px system-ui,sans-serif;fill:#657985}.value{font:700 14px system-ui,sans-serif;fill:#18344d}
    .grid{stroke:#dfe7eb;stroke-width:1}.zero{stroke:#647a86;stroke-width:2}.axis{stroke:#91a3ad;stroke-width:1.5}
    .allline{fill:none;stroke:#225f7d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.allpoint{fill:#225f7d;stroke:#fff;stroke-width:2}
    .balline{fill:none;stroke:#b34a66;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.balpoint{fill:#b34a66;stroke:#fff;stroke-width:2}
    .chip{font:600 12px system-ui,sans-serif;fill:#47606f}.avg{font:700 25px system-ui,sans-serif;fill:#18344d}
  </style>
  <rect width="1200" height="700" rx="24" fill="#f7fafb"/>
  <text x="600" y="44" text-anchor="middle" class="title">Una trayectoria dinámica también cambia de composición</text>
  <text x="600" y="72" text-anchor="middle" class="sub">DR-IPW con condados nunca tratados · efecto sobre el log del empleo adolescente</text>

  <rect x="45" y="105" width="700" height="430" rx="18" fill="#ffffff" stroke="#dce6eb"/>
  <text x="75" y="140" class="panel">Toda la información disponible</text>
  <text x="75" y="164" class="small">Las cohortes cambian con el horizonte</text>
  <g class="grid">
    <line x1="120" y1="205" x2="700" y2="205"/><line x1="120" y1="285" x2="700" y2="285"/>
    <line x1="120" y1="365" x2="700" y2="365"/><line x1="120" y1="445" x2="700" y2="445"/>
  </g>
  <line x1="120" y1="205" x2="700" y2="205" class="zero"/>
  <line x1="120" y1="190" x2="120" y2="470" class="axis"/>
  <g class="small" text-anchor="end">
    <text x="105" y="210">0</text><text x="105" y="290">−0,05</text><text x="105" y="370">−0,10</text><text x="105" y="450">−0,15</text>
  </g>
  <polyline points="190,239 340,290 490,430 640,376" class="allline"/>
  <g class="allpoint">
    <circle cx="190" cy="239" r="9"/><circle cx="340" cy="290" r="9"/><circle cx="490" cy="430" r="9"/><circle cx="640" cy="376" r="9"/>
  </g>
  <g class="value" text-anchor="middle">
    <text x="190" y="226">−0,0211</text><text x="340" y="277">−0,0530</text><text x="490" y="452">−0,1404</text><text x="640" y="363">−0,1069</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="190" y="493">e = 0</text><text x="340" y="493">e = 1</text><text x="490" y="493">e = 2</text><text x="640" y="493">e = 3</text>
  </g>
  <g text-anchor="middle">
    <rect x="139" y="505" width="102" height="23" rx="11" fill="#e6f0f4"/><text x="190" y="521" class="chip">3 cohortes</text>
    <rect x="289" y="505" width="102" height="23" rx="11" fill="#e6f0f4"/><text x="340" y="521" class="chip">2 cohortes</text>
    <rect x="439" y="505" width="102" height="23" rx="11" fill="#e6f0f4"/><text x="490" y="521" class="chip">solo 2004</text>
    <rect x="589" y="505" width="102" height="23" rx="11" fill="#e6f0f4"/><text x="640" y="521" class="chip">solo 2004</text>
  </g>

  <rect x="775" y="105" width="380" height="430" rx="18" fill="#fff8fa" stroke="#e3c1cb"/>
  <text x="805" y="140" class="panel">Composición balanceada</text>
  <text x="805" y="164" class="small">Cohortes 2004 y 2006 · hasta e' = 1</text>
  <g class="grid">
    <line x1="825" y1="205" x2="1110" y2="205"/><line x1="825" y1="285" x2="1110" y2="285"/>
    <line x1="825" y1="365" x2="1110" y2="365"/><line x1="825" y1="445" x2="1110" y2="445"/>
  </g>
  <line x1="825" y1="205" x2="1110" y2="205" class="zero"/>
  <polyline points="895,212 1040,290" class="balline"/>
  <g class="balpoint"><circle cx="895" cy="212" r="9"/><circle cx="1040" cy="290" r="9"/></g>
  <g class="value" text-anchor="middle"><text x="895" y="198">−0,0042</text><text x="1040" y="277">−0,0530</text></g>
  <g class="label" text-anchor="middle"><text x="895" y="493">e = 0</text><text x="1040" y="493">e = 1</text></g>
  <rect x="832" y="505" width="271" height="23" rx="11" fill="#f6dfe6"/><text x="968" y="521" text-anchor="middle" class="chip">las mismas 2 cohortes en ambos puntos</text>

  <rect x="45" y="566" width="535" height="94" rx="16" fill="#eaf3f6" stroke="#c7dce5"/>
  <text x="72" y="597" class="label">Promedio post no balanceado</text><text x="72" y="635" class="avg">−0,08035</text>
  <rect x="620" y="566" width="535" height="94" rx="16" fill="#fff2f5" stroke="#e3c1cb"/>
  <text x="647" y="597" class="label">Promedio post balanceado hasta e' = 1</text><text x="647" y="635" class="avg">−0,02860</text>
  <text x="600" y="684" text-anchor="middle" class="small">Estimandos distintos: cobertura máxima vs. composición constante</text>
</svg>
