<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Continuidad visual de covariables predeterminadas alrededor del umbral</title>
  <desc id="desc">Tres paneles muestran promedios por intervalos y ajustes lineales locales para población previa, número de partidos y categoría administrativa. Las líneas se estiman por separado a cada lado del margen electoral igual a cero.</desc>
  <style>
    .title{font:700 27px system-ui,sans-serif;fill:#18344d}.sub{font:400 14px system-ui,sans-serif;fill:#5d7180}
    .panel-title{font:700 18px system-ui,sans-serif;fill:#263f52}.panel-sub{font:400 13px system-ui,sans-serif;fill:#657985}
    .axis{stroke:#71848e;stroke-width:1.3}.grid{stroke:#e2e9ed;stroke-width:1}.cut{stroke:#b34a66;stroke-width:2;stroke-dasharray:7 6}
    .fit{stroke:#225f7d;stroke-width:3;stroke-linecap:round}.point{fill:#80939d;fill-opacity:.82;stroke:#fff;stroke-width:1.5}
    .tick{font:400 12px system-ui,sans-serif;fill:#657985}.note{font:600 14px system-ui,sans-serif;fill:#425c6c}
  </style>
  <rect width="1200" height="720" rx="24" fill="#f7fafb"/>
  <text x="600" y="43" text-anchor="middle" class="title">Covariables predeterminadas alrededor del cutoff</text>
  <text x="600" y="68" text-anchor="middle" class="sub">Promedios por intervalos y ajustes lineales locales a cada lado de una elección empatada</text>

  <!-- Población previa -->
  <rect x="30" y="90" width="560" height="260" rx="18" fill="#fff" stroke="#dce6eb"/>
  <text x="55" y="120" class="panel-title">Población previa</text><text x="55" y="140" class="panel-sub">Log de población municipal en 1994</text>
  <line x1="85" y1="305" x2="555" y2="305" class="axis"/><line x1="85" y1="165" x2="85" y2="305" class="axis"/>
  <line x1="85" y1="235" x2="555" y2="235" class="grid"/><line x1="320" y1="155" x2="320" y2="305" class="cut"/>
  <line x1="105" y1="265" x2="315" y2="205" class="fit"/><line x1="325" y1="216" x2="535" y2="198" class="fit"/>
  <g class="point"><circle cx="112" cy="281" r="6"/><circle cx="142" cy="294" r="6"/><circle cx="173" cy="260" r="6"/><circle cx="205" cy="248" r="6"/><circle cx="237" cy="252" r="6"/><circle cx="269" cy="194" r="6"/><circle cx="300" cy="255" r="6"/><circle cx="313" cy="207" r="6"/><circle cx="337" cy="205" r="6"/><circle cx="370" cy="246" r="6"/><circle cx="404" cy="296" r="6"/><circle cx="438" cy="229" r="6"/><circle cx="472" cy="178" r="6"/><circle cx="508" cy="265" r="6"/></g>
  <text x="85" y="326" class="tick" text-anchor="middle">−10</text><text x="320" y="326" class="tick" text-anchor="middle">0</text><text x="555" y="326" class="tick" text-anchor="middle">10</text>

  <!-- Número de partidos -->
  <rect x="610" y="90" width="560" height="260" rx="18" fill="#fff" stroke="#dce6eb"/>
  <text x="635" y="120" class="panel-title">Número de partidos</text><text x="635" y="140" class="panel-sub">Competencia electoral municipal</text>
  <line x1="665" y1="305" x2="1135" y2="305" class="axis"/><line x1="665" y1="165" x2="665" y2="305" class="axis"/>
  <line x1="665" y1="235" x2="1135" y2="235" class="grid"/><line x1="900" y1="155" x2="900" y2="305" class="cut"/>
  <line x1="685" y1="207" x2="895" y2="230" class="fit"/><line x1="905" y1="247" x2="1115" y2="178" class="fit"/>
  <g class="point"><circle cx="692" cy="276" r="6"/><circle cx="724" cy="260" r="6"/><circle cx="756" cy="202" r="6"/><circle cx="789" cy="190" r="6"/><circle cx="823" cy="215" r="6"/><circle cx="856" cy="180" r="6"/><circle cx="887" cy="258" r="6"/><circle cx="912" cy="229" r="6"/><circle cx="944" cy="268" r="6"/><circle cx="978" cy="278" r="6"/><circle cx="1012" cy="186" r="6"/><circle cx="1046" cy="245" r="6"/><circle cx="1080" cy="169" r="6"/><circle cx="1114" cy="220" r="6"/></g>
  <text x="665" y="326" class="tick" text-anchor="middle">−10</text><text x="900" y="326" class="tick" text-anchor="middle">0</text><text x="1135" y="326" class="tick" text-anchor="middle">10</text>

  <!-- Categoría administrativa -->
  <rect x="320" y="382" width="560" height="260" rx="18" fill="#fff" stroke="#dce6eb"/>
  <text x="345" y="412" class="panel-title">Categoría administrativa</text><text x="345" y="432" class="panel-sub">Proporción municipal en la categoría observada</text>
  <line x1="375" y1="597" x2="845" y2="597" class="axis"/><line x1="375" y1="457" x2="375" y2="597" class="axis"/>
  <line x1="375" y1="527" x2="845" y2="527" class="grid"/><line x1="610" y1="447" x2="610" y2="597" class="cut"/>
  <line x1="395" y1="574" x2="605" y2="482" class="fit"/><line x1="615" y1="510" x2="825" y2="536" class="fit"/>
  <g class="point"><circle cx="402" cy="560" r="6"/><circle cx="434" cy="574" r="6"/><circle cx="466" cy="540" r="6"/><circle cx="499" cy="527" r="6"/><circle cx="532" cy="561" r="6"/><circle cx="565" cy="481" r="6"/><circle cx="597" cy="452" r="6"/><circle cx="622" cy="506" r="6"/><circle cx="654" cy="548" r="6"/><circle cx="688" cy="566" r="6"/><circle cx="722" cy="496" r="6"/><circle cx="756" cy="575" r="6"/><circle cx="790" cy="517" r="6"/><circle cx="824" cy="552" r="6"/></g>
  <text x="375" y="618" class="tick" text-anchor="middle">−10</text><text x="610" y="618" class="tick" text-anchor="middle">0</text><text x="845" y="618" class="tick" text-anchor="middle">10</text>

  <text x="600" y="677" text-anchor="middle" class="note">Margen de victoria islámica · cutoff = 0</text>
  <text x="600" y="699" text-anchor="middle" class="sub">Tres diagnósticos visuales representativos; los tests formales cubren siete covariables predeterminadas.</text>
</svg>
