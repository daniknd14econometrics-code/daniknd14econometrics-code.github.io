<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Event study rolling: demeaning frente a detrending</title>
  <desc id="desc">Comparación de WATT por tiempo relativo entre menos ocho y ocho años. Demeaning conserva una trayectoria previa ascendente y efectos posteriores mayores; detrending acerca los puntos previos a cero y reduce la trayectoria posterior.</desc>
  <style>
    .title{font:700 28px system-ui,sans-serif;fill:#18344d}.sub{font:400 15px system-ui,sans-serif;fill:#5b6f7c}
    .axis{stroke:#7c8f9a;stroke-width:1.4}.grid{stroke:#dce5e9;stroke-width:1}.zero{stroke:#6d7d86;stroke-width:2}
    .tick{font:500 13px system-ui,sans-serif;fill:#5b6f7c}.legend{font:600 15px system-ui,sans-serif;fill:#263f52}
    .demean{stroke:#bd3c62;fill:none;stroke-width:3}.detrend{stroke:#1f6685;fill:none;stroke-width:3}
    .p1{fill:#bd3c62;stroke:#fff;stroke-width:1.5}.p2{fill:#1f6685;stroke:#fff;stroke-width:1.5}
  </style>
  <rect width="1200" height="700" rx="24" fill="#f7fafb"/>
  <text x="600" y="44" text-anchor="middle" class="title">La transformación cambia la trayectoria estimada</text>
  <text x="600" y="70" text-anchor="middle" class="sub">WATT(k), IPWRA con covariables · ventana k = −8…8 · al menos seis cohortes por horizonte</text>

  <line x1="115" y1="90" x2="115" y2="580" class="axis"/><line x1="115" y1="580" x2="1125" y2="580" class="axis"/>
  <line x1="115" y1="516" x2="1125" y2="516" class="zero"/>
  <line x1="115" y1="409" x2="1125" y2="409" class="grid"/><line x1="115" y1="303" x2="1125" y2="303" class="grid"/><line x1="115" y1="196" x2="1125" y2="196" class="grid"/><line x1="115" y1="90" x2="1125" y2="90" class="grid"/>
  <text x="98" y="521" text-anchor="end" class="tick">0,00</text><text x="98" y="414" text-anchor="end" class="tick">0,05</text><text x="98" y="308" text-anchor="end" class="tick">0,10</text><text x="98" y="201" text-anchor="end" class="tick">0,15</text><text x="98" y="95" text-anchor="end" class="tick">0,20</text>
  <text x="33" y="335" text-anchor="middle" transform="rotate(-90 33 335)" class="legend">WATT(k)</text>

  <line x1="620" y1="90" x2="620" y2="580" stroke="#9aa9b1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="620" y="607" text-anchor="middle" class="tick">0</text>
  <text x="620" y="628" text-anchor="middle" class="tick">primera apertura</text>

  <polyline points="115,503 178,492 241,491 304,479 367,471 430,474 493,477 556,516 620,432 683,364 746,363 809,358 872,347 935,322 998,299 1061,256 1125,224" class="demean"/>
  <polyline points="115,507 178,503 241,510 304,506 367,506 430,516 493,516 556,516 620,498 683,441 746,454 809,462 872,466 935,463 998,454 1061,416 1125,400" class="detrend"/>

  <g>
    <circle cx="115" cy="503" r="6" class="p1"/><circle cx="178" cy="492" r="6" class="p1"/><circle cx="241" cy="491" r="6" class="p1"/><circle cx="304" cy="479" r="6" class="p1"/><circle cx="367" cy="471" r="6" class="p1"/><circle cx="430" cy="474" r="6" class="p1"/><circle cx="493" cy="477" r="6" class="p1"/><circle cx="556" cy="516" r="6" class="p1"/><circle cx="620" cy="432" r="6" class="p1"/><circle cx="683" cy="364" r="6" class="p1"/><circle cx="746" cy="363" r="6" class="p1"/><circle cx="809" cy="358" r="6" class="p1"/><circle cx="872" cy="347" r="6" class="p1"/><circle cx="935" cy="322" r="6" class="p1"/><circle cx="998" cy="299" r="6" class="p1"/><circle cx="1061" cy="256" r="6" class="p1"/><circle cx="1125" cy="224" r="6" class="p1"/>
    <circle cx="115" cy="507" r="6" class="p2"/><circle cx="178" cy="503" r="6" class="p2"/><circle cx="241" cy="510" r="6" class="p2"/><circle cx="304" cy="506" r="6" class="p2"/><circle cx="367" cy="506" r="6" class="p2"/><circle cx="430" cy="516" r="6" class="p2"/><circle cx="493" cy="516" r="6" class="p2"/><circle cx="556" cy="516" r="6" class="p2"/><circle cx="620" cy="498" r="6" class="p2"/><circle cx="683" cy="441" r="6" class="p2"/><circle cx="746" cy="454" r="6" class="p2"/><circle cx="809" cy="462" r="6" class="p2"/><circle cx="872" cy="466" r="6" class="p2"/><circle cx="935" cy="463" r="6" class="p2"/><circle cx="998" cy="454" r="6" class="p2"/><circle cx="1061" cy="416" r="6" class="p2"/><circle cx="1125" cy="400" r="6" class="p2"/>
  </g>

  <g class="tick">
    <text x="115" y="603" text-anchor="middle">−8</text><text x="241" y="603" text-anchor="middle">−6</text><text x="367" y="603" text-anchor="middle">−4</text><text x="493" y="603" text-anchor="middle">−2</text><text x="556" y="603" text-anchor="middle">−1</text><text x="746" y="603" text-anchor="middle">2</text><text x="872" y="603" text-anchor="middle">4</text><text x="998" y="603" text-anchor="middle">6</text><text x="1125" y="603" text-anchor="middle">8</text>
  </g>
  <text x="620" y="662" text-anchor="middle" class="legend">Tiempo relativo k = r − g</text>

  <line x1="130" y1="112" x2="178" y2="112" class="demean"/><circle cx="154" cy="112" r="6" class="p1"/><text x="190" y="118" class="legend">Demean: media pre</text>
  <line x1="390" y1="112" x2="438" y2="112" class="detrend"/><circle cx="414" cy="112" r="6" class="p2"/><text x="450" y="118" class="legend">Detrend: tendencia lineal pre</text>
  <rect x="775" y="104" width="326" height="72" rx="12" fill="#fff" stroke="#cbd8df"/>
  <text x="793" y="130" class="legend">Lectura central</text><text x="793" y="153" class="sub">La trayectoria previa se aplana y el post se reduce.</text>
  <text x="115" y="684" class="sub">Puntos estimados; los intervalos simultáneos se omiten para preservar legibilidad. Detrend usa k=−2 y k=−1 para construir la tendencia de referencia.</text>
</svg>
