<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Efectos positivos y pesos negativos en una simulación TWFE</title>
  <desc id="desc">Tres efectos tratados positivos, de cuatro, uno y uno, reciben pesos de menos cero coma cinco, cero coma cinco y uno. El ATT es dos y TWFE es menos cero coma cinco.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#15324a">Efectos positivos + un peso negativo = TWFE fuera del rango</text>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">Simulación 2×3: tres celdas tratadas y una agregación no convexa</text>

  <rect x="42" y="102" width="530" height="416" rx="14" fill="#f8fafc" stroke="#dce5eb"/>
  <rect x="594" y="102" width="564" height="416" rx="14" fill="#f8fafc" stroke="#dce5eb"/>
  <text x="307" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#15324a">Efectos causales por celda tratada</text>
  <text x="876" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#15324a">Pesos implícitos de TWFE</text>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="102" y1="450" x2="530" y2="450"/><line x1="102" y1="378" x2="530" y2="378"/>
    <line x1="102" y1="306" x2="530" y2="306"/><line x1="102" y1="234" x2="530" y2="234"/>
    <line x1="102" y1="162" x2="530" y2="162"/>
  </g>
  <line x1="102" y1="162" x2="102" y2="450" stroke="#8293a1" stroke-width="2"/>
  <line x1="102" y1="450" x2="530" y2="450" stroke="#8293a1" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#526575" text-anchor="end">
    <text x="91" y="456">0</text><text x="91" y="384">1</text><text x="91" y="312">2</text><text x="91" y="240">3</text><text x="91" y="168">4</text>
  </g>
  <g fill="#277da1">
    <rect x="150" y="162" width="86" height="288" rx="5"/>
    <rect x="286" y="378" width="86" height="72" rx="5"/>
    <rect x="422" y="378" width="86" height="72" rx="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#15324a" text-anchor="middle">
    <text x="193" y="153">4</text><text x="329" y="369">1</text><text x="465" y="369">1</text>
  </g>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="652" y1="450" x2="1122" y2="450"/><line x1="652" y1="306" x2="1122" y2="306"/>
    <line x1="652" y1="162" x2="1122" y2="162"/><line x1="652" y1="522" x2="1122" y2="522"/>
  </g>
  <line x1="652" y1="150" x2="652" y2="522" stroke="#8293a1" stroke-width="2"/>
  <line x1="652" y1="450" x2="1122" y2="450" stroke="#15324a" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#526575" text-anchor="end">
    <text x="641" y="528">−0,5</text><text x="641" y="456">0</text><text x="641" y="312">0,5</text><text x="641" y="168">1</text>
  </g>
  <rect x="704" y="450" width="92" height="72" rx="5" fill="#d95f76"/>
  <rect x="854" y="306" width="92" height="144" rx="5" fill="#6aa6c2"/>
  <rect x="1004" y="162" width="92" height="288" rx="5" fill="#277da1"/>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="750" y="550" fill="#9f3049">−0,5</text><text x="900" y="296" fill="#15324a">0,5</text><text x="1050" y="152" fill="#15324a">1</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#314858" text-anchor="middle">
    <text x="193" y="478"><tspan x="193">Grupo 2</tspan><tspan x="193" dy="18">período 3</tspan></text>
    <text x="329" y="478"><tspan x="329">Grupo 1</tspan><tspan x="329" dy="18">período 3</tspan></text>
    <text x="465" y="478"><tspan x="465">Grupo 2</tspan><tspan x="465" dy="18">período 2</tspan></text>
    <text x="750" y="478"><tspan x="750">Efecto 4</tspan><tspan x="750" dy="18">aporte −2</tspan></text>
    <text x="900" y="478"><tspan x="900">Efecto 1</tspan><tspan x="900" dy="18">aporte 0,5</tspan></text>
    <text x="1050" y="478"><tspan x="1050">Efecto 1</tspan><tspan x="1050" dy="18">aporte 1</tspan></text>
  </g>

  <rect x="92" y="558" width="1016" height="64" rx="12" fill="#eef5f8" stroke="#c8dae3"/>
  <text x="600" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#15324a">ATT promedio = 2</text>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9f3049">TWFE = (4 × −0,5) + (1 × 0,5) + (1 × 1) = −0,5</text>
</svg>
