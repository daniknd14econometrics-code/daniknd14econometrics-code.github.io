<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura rolling de Lee–Wooldridge</title>
  <desc id="desc">Dos cohortes con diferentes fechas de adopción utilizan historias pretratamiento distintas. El outcome transformado se compara con controles válidos para estimar ATT por celda y luego WATT por tiempo relativo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#597083"/>
    </marker>
    <style>
      .title{font:700 29px system-ui,sans-serif;fill:#18344d}.sub{font:400 16px system-ui,sans-serif;fill:#556b7b}
      .label{font:700 17px system-ui,sans-serif;fill:#18344d}.small{font:400 14px system-ui,sans-serif;fill:#526979}
      .year{font:600 13px system-ui,sans-serif;fill:#526979}.box{fill:#fff;stroke:#cbd8df;stroke-width:1.5}
      .pre{fill:#dcecf2;stroke:#85a9b8}.post{fill:#f7dfe4;stroke:#c96b83}.control{fill:#e5eee8;stroke:#789985}
      .step{fill:#f7fafb;stroke:#c6d4dc;stroke-width:1.5}.formula{font:600 16px system-ui,sans-serif;fill:#244c66}
    </style>
  </defs>
  <rect width="1320" height="760" rx="24" fill="#f4f8fa"/>
  <text x="660" y="48" text-anchor="middle" class="title">La referencia pretratamiento rueda con la cohorte</text>
  <text x="660" y="77" text-anchor="middle" class="sub">Cada fecha de adopción define qué historia previa transforma el outcome antes de construir la comparación causal.</text>

  <rect x="55" y="110" width="1210" height="310" rx="20" class="box"/>
  <text x="85" y="145" class="label">Dos cohortes, dos referencias pretratamiento</text>

  <text x="90" y="204" class="label">Cohorte temprana · adopta en g₁</text>
  <text x="90" y="230" class="small">Promedia únicamente los períodos anteriores a g₁</text>
  <g transform="translate(420 175)">
    <rect x="0" y="0" width="72" height="55" rx="8" class="pre"/><rect x="80" y="0" width="72" height="55" rx="8" class="pre"/><rect x="160" y="0" width="72" height="55" rx="8" class="pre"/>
    <rect x="240" y="0" width="72" height="55" rx="8" class="post"/><rect x="320" y="0" width="72" height="55" rx="8" class="post"/><rect x="400" y="0" width="72" height="55" rx="8" class="post"/>
    <rect x="480" y="0" width="72" height="55" rx="8" class="post"/><rect x="560" y="0" width="72" height="55" rx="8" class="post"/><rect x="640" y="0" width="72" height="55" rx="8" class="post"/>
    <text x="36" y="34" text-anchor="middle" class="year">t1</text><text x="116" y="34" text-anchor="middle" class="year">t2</text><text x="196" y="34" text-anchor="middle" class="year">t3</text>
    <text x="276" y="34" text-anchor="middle" class="year">g₁</text><text x="356" y="34" text-anchor="middle" class="year">t5</text><text x="436" y="34" text-anchor="middle" class="year">r</text>
    <text x="516" y="34" text-anchor="middle" class="year">t7</text><text x="596" y="34" text-anchor="middle" class="year">t8</text><text x="676" y="34" text-anchor="middle" class="year">t9</text>
  </g>

  <text x="90" y="320" class="label">Cohorte tardía · adopta en g₂</text>
  <text x="90" y="346" class="small">Su referencia incorpora una historia pre más extensa</text>
  <g transform="translate(420 291)">
    <rect x="0" y="0" width="72" height="55" rx="8" class="pre"/><rect x="80" y="0" width="72" height="55" rx="8" class="pre"/><rect x="160" y="0" width="72" height="55" rx="8" class="pre"/>
    <rect x="240" y="0" width="72" height="55" rx="8" class="pre"/><rect x="320" y="0" width="72" height="55" rx="8" class="pre"/><rect x="400" y="0" width="72" height="55" rx="8" class="pre"/>
    <rect x="480" y="0" width="72" height="55" rx="8" class="post"/><rect x="560" y="0" width="72" height="55" rx="8" class="post"/><rect x="640" y="0" width="72" height="55" rx="8" class="post"/>
    <text x="36" y="34" text-anchor="middle" class="year">t1</text><text x="116" y="34" text-anchor="middle" class="year">t2</text><text x="196" y="34" text-anchor="middle" class="year">t3</text>
    <text x="276" y="34" text-anchor="middle" class="year">t4</text><text x="356" y="34" text-anchor="middle" class="year">t5</text><text x="436" y="34" text-anchor="middle" class="year">t6</text>
    <text x="516" y="34" text-anchor="middle" class="year">g₂</text><text x="596" y="34" text-anchor="middle" class="year">r</text><text x="676" y="34" text-anchor="middle" class="year">t9</text>
  </g>
  <rect x="87" y="375" width="18" height="18" rx="4" class="pre"/><text x="114" y="389" class="small">historia pre usada en la transformación</text>
  <rect x="410" y="375" width="18" height="18" rx="4" class="post"/><text x="437" y="389" class="small">período tratado</text>

  <g transform="translate(55 475)">
    <rect x="0" y="0" width="235" height="165" rx="18" class="step"/>
    <text x="117" y="36" text-anchor="middle" class="label">1 · Historia pre de g</text>
    <text x="117" y="72" text-anchor="middle" class="formula">Yᵢr − promedio pre(g)</text>
    <text x="117" y="103" text-anchor="middle" class="small">La ventana depende del</text><text x="117" y="124" text-anchor="middle" class="small">timing de adopción.</text>
    <path d="M240 82 H275" stroke="#597083" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="285" y="0" width="235" height="165" rx="18" class="step"/>
    <text x="402" y="36" text-anchor="middle" class="label">2 · Outcome transformado</text>
    <text x="402" y="77" text-anchor="middle" class="formula">Ẏᵢrg</text>
    <text x="402" y="103" text-anchor="middle" class="small">No es una media móvil</text><text x="402" y="124" text-anchor="middle" class="small">de outcomes post.</text>
    <path d="M525 82 H560" stroke="#597083" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="570" y="0" width="270" height="165" rx="18" class="step"/>
    <text x="705" y="36" text-anchor="middle" class="label">3 · Comparación válida en r</text>
    <rect x="610" y="61" width="80" height="42" rx="9" class="post"/><text x="650" y="87" text-anchor="middle" class="year">cohorte g</text>
    <text x="705" y="87" text-anchor="middle" class="label">vs</text>
    <rect x="724" y="61" width="80" height="42" rx="9" class="control"/><text x="764" y="80" text-anchor="middle" class="year">nunca /</text><text x="764" y="96" text-anchor="middle" class="year">aún no</text>
    <text x="705" y="132" text-anchor="middle" class="small">Nunca unidades ya tratadas.</text>
    <path d="M845 82 H880" stroke="#597083" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="890" y="0" width="150" height="165" rx="18" class="step"/>
    <text x="965" y="47" text-anchor="middle" class="label">4 · Celda</text><text x="965" y="92" text-anchor="middle" class="formula">ATT(g,r)</text>
    <path d="M1045 82 H1080" stroke="#597083" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1090" y="0" width="175" height="165" rx="18" class="step"/>
    <text x="1177" y="47" text-anchor="middle" class="label">5 · Agregación</text><text x="1177" y="92" text-anchor="middle" class="formula">WATT(k)</text>
    <text x="1177" y="124" text-anchor="middle" class="small">k = r − g</text>
  </g>
  <text x="660" y="705" text-anchor="middle" class="sub">Transformar → comparar → estimar por celda → agregar. La identificación no proviene de una regresión global única.</text>
</svg>
