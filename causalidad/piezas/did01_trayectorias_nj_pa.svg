<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Trayectorias medias de empleo FTE en Nueva Jersey y Pensilvania</title>
  <desc id="desc">Nueva Jersey pasa de 20,431 a 20,897 empleos FTE promedio, mientras Pensilvania pasa de 23,380 a 21,097. Una trayectoria contrafactual paralela para Nueva Jersey habría terminado en 18,147, por lo que la doble diferencia es 2,750 FTE.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#15324a">Empleo medio antes y después del aumento salarial</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">Restaurantes de Nueva Jersey y Pensilvania</text>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="130" y1="570" x2="930" y2="570"/>
    <line x1="130" y1="495" x2="930" y2="495"/>
    <line x1="130" y1="420" x2="930" y2="420"/>
    <line x1="130" y1="345" x2="930" y2="345"/>
    <line x1="130" y1="270" x2="930" y2="270"/>
    <line x1="130" y1="195" x2="930" y2="195"/>
    <line x1="130" y1="120" x2="930" y2="120"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#526575" text-anchor="end">
    <text x="116" y="576">18</text><text x="116" y="501">19</text>
    <text x="116" y="426">20</text><text x="116" y="351">21</text>
    <text x="116" y="276">22</text><text x="116" y="201">23</text>
    <text x="116" y="126">24</text>
  </g>
  <line x1="130" y1="120" x2="130" y2="570" stroke="#8293a1" stroke-width="2"/>
  <line x1="130" y1="570" x2="930" y2="570" stroke="#8293a1" stroke-width="2"/>
  <text x="42" y="348" transform="rotate(-90 42 348)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#314858">Empleo FTE promedio</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#314858" text-anchor="middle">
    <text x="300" y="615">Antes</text><text x="780" y="615">Después</text>
  </g>

  <path d="M300 166.5 L780 337.8" fill="none" stroke="#277da1" stroke-width="5"/>
  <circle cx="300" cy="166.5" r="8" fill="#277da1"/>
  <circle cx="780" cy="337.8" r="8" fill="#277da1"/>

  <path d="M300 387.7 L780 352.7" fill="none" stroke="#c94f6d" stroke-width="5"/>
  <circle cx="300" cy="387.7" r="8" fill="#c94f6d"/>
  <circle cx="780" cy="352.7" r="8" fill="#c94f6d"/>

  <path d="M300 387.7 L780 558.9" fill="none" stroke="#c94f6d" stroke-width="3" stroke-dasharray="10 8" opacity="0.72"/>
  <circle cx="780" cy="558.9" r="7" fill="#ffffff" stroke="#c94f6d" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="270" y="147" text-anchor="end" fill="#277da1">23,380</text>
    <text x="800" y="322" fill="#277da1">21,097</text>
    <text x="270" y="412" text-anchor="end" fill="#c94f6d">20,431</text>
    <text x="800" y="378" fill="#c94f6d">20,897</text>
  </g>

  <line x1="870" y1="352.7" x2="870" y2="558.9" stroke="#15324a" stroke-width="3"/>
  <line x1="858" y1="352.7" x2="882" y2="352.7" stroke="#15324a" stroke-width="3"/>
  <line x1="858" y1="558.9" x2="882" y2="558.9" stroke="#15324a" stroke-width="3"/>
  <rect x="900" y="420" width="250" height="78" rx="10" fill="#edf4f7" stroke="#b8ccd7"/>
  <text x="1025" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#314858">Doble diferencia</text>
  <text x="1025" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#15324a">+2,750 FTE</text>

  <g font-family="Arial, sans-serif" font-size="17" fill="#314858">
    <line x1="955" y1="154" x2="1005" y2="154" stroke="#277da1" stroke-width="5"/>
    <text x="1020" y="160">Pensilvania (control)</text>
    <line x1="955" y1="194" x2="1005" y2="194" stroke="#c94f6d" stroke-width="5"/>
    <text x="1020" y="200">Nueva Jersey (tratado)</text>
    <line x1="955" y1="234" x2="1005" y2="234" stroke="#c94f6d" stroke-width="3" stroke-dasharray="10 8" opacity="0.72"/>
    <text x="1020" y="240">Contrafactual paralelo</text>
  </g>
  <text x="600" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526575">El contrafactual aplica a Nueva Jersey el cambio observado en Pensilvania: −2,283 FTE.</text>
</svg>
