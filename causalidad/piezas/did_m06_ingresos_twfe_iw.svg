<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ingresos laborales alrededor de la hospitalización: TWFE e interaction-weighted</title>
  <desc id="desc">TWFE e interaction-weighted muestran trayectorias similares: valores imprecisos antes de la hospitalización y caídas de ingresos desde el período cero hasta el período dos.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#15324a">Ingresos laborales: trayectorias próximas, estimandos distintos</text>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526575">Estimaciones en dólares reales de 2005; intervalos de confianza de 95%</text>

  <g stroke="#dce5eb" stroke-width="1">
    <line x1="118" y1="134" x2="1120" y2="134"/><line x1="118" y1="214" x2="1120" y2="214"/>
    <line x1="118" y1="294" x2="1120" y2="294"/><line x1="118" y1="374" x2="1120" y2="374"/>
    <line x1="118" y1="454" x2="1120" y2="454"/>
  </g>
  <line x1="743" y1="106" x2="743" y2="478" stroke="#8293a1" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#314858" text-anchor="end">
    <text x="96" y="140">−3</text><text x="96" y="220">−2</text><text x="96" y="300">0</text><text x="96" y="380">1</text><text x="96" y="460">2</text>
  </g>
  <text x="48" y="294" transform="rotate(-90 48 294)" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">Tiempo relativo</text>

  <g stroke="#277da1" stroke-width="4" stroke-linecap="round">
    <line x1="647" y1="126" x2="977" y2="126"/><line x1="569" y1="206" x2="803" y2="206"/>
    <line x1="499" y1="286" x2="724" y2="286"/><line x1="288" y1="366" x2="693" y2="366"/>
    <line x1="161" y1="446" x2="734" y2="446"/>
  </g>
  <g stroke="#d95f76" stroke-width="4" stroke-linecap="round">
    <line x1="511" y1="142" x2="1079" y2="142"/><line x1="487" y1="222" x2="853" y2="222"/>
    <line x1="459" y1="302" x2="724" y2="302"/><line x1="314" y1="382" x2="729" y2="382"/>
    <line x1="133" y1="462" x2="739" y2="462"/>
  </g>
  <g fill="#277da1">
    <circle cx="812" cy="126" r="8"/><circle cx="686" cy="206" r="8"/><circle cx="611" cy="286" r="8"/><circle cx="491" cy="366" r="8"/><circle cx="447" cy="446" r="8"/>
  </g>
  <g fill="#d95f76">
    <rect x="787" y="134" width="16" height="16" rx="3"/><rect x="662" y="214" width="16" height="16" rx="3"/>
    <rect x="584" y="294" width="16" height="16" rx="3"/><rect x="514" y="374" width="16" height="16" rx="3"/>
    <rect x="428" y="454" width="16" height="16" rx="3"/>
  </g>

  <line x1="118" y1="488" x2="1120" y2="488" stroke="#8293a1" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#526575" text-anchor="middle">
    <text x="118" y="514">−30.000</text><text x="326" y="514">−20.000</text><text x="535" y="514">−10.000</text><text x="743" y="514">0</text><text x="951" y="514">10.000</text>
  </g>
  <text x="619" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">Efecto estimado sobre ingresos laborales</text>

  <g font-family="Arial, sans-serif" font-size="17" fill="#314858">
    <circle cx="430" cy="582" r="8" fill="#277da1"/><text x="448" y="588">TWFE</text>
    <rect x="635" y="574" width="16" height="16" rx="3" fill="#d95f76"/><text x="663" y="588">Interaction-weighted</text>
  </g>
</svg>
